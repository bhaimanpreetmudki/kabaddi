<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Sukhdeep TV - Fixed Auto Scroll</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --main-red: #cc0000;
            --pure-white: #ffffff;
            --pure-black: #000000;
            --container-width: 610px;
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: transparent; }

        #scoreboard-wrapper { position: absolute; top: 25px; left: 20px; display: flex; flex-direction: column; gap: 2px; }
        
        #scoreboard-container { 
            display: flex; 
            width: var(--container-width); 
            border: 3px solid var(--pure-white); 
            border-radius: 6px; 
            overflow: hidden; 
            background: var(--pure-black); 
        }

        .jersey-strip { width: 12px; height: 60px; flex-shrink: 0; }
        
        .score-unit { 
            display: flex; 
            height: 60px; 
            width: 50%; 
            position: relative; 
            overflow: hidden; 
        }

        .side-a { background: var(--main-red); color: var(--pure-white); border-right: 1px solid white; flex-direction: row; }
        .side-b { background: var(--pure-white); color: var(--main-red); border-left: 1px solid white; flex-direction: row-reverse; }

        /* Score Box - "00" size */
        .score-box { 
            width: 55px; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 38px; 
            font-weight: 900; 
            flex-shrink: 0; 
            z-index: 10; 
            background: rgba(0,0,0,0.1); 
        }

        /* Team Name Area with Fix for Scroll */
        .team-display-wrapper { 
            flex: 1; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            height: 100%; 
            padding: 0 5px;
            position: relative;
        }
        
        .team-display { 
            font-size: 34px; 
            font-weight: 900; 
            text-transform: uppercase; 
            white-space: nowrap; 
            display: inline-block;
            position: absolute; /* Fixed position for scrolling logic */
            will-change: transform;
        }

        /* Dynamic Animation */
        @keyframes scrollText {
            0% { transform: translateX(0); }
            20% { transform: translateX(0); }
            80% { transform: translateX(var(--scroll-dist)); }
            100% { transform: translateX(var(--scroll-dist)); }
        }

        #match-timer-box { 
            background: var(--main-red); color: white; height: 60px; 
            display: none; align-items: center; padding: 0 15px; font-size: 32px; font-weight: 900; border: 3px solid white; border-left: none; border-radius: 0 6px 6px 0;
        }

        #match-details { display: flex; justify-content: space-between; padding: 0 5px; color: var(--pure-white); font-size: 24px; font-weight: 700; width: var(--container-width); text-transform: uppercase; }

        /* Ticker - Original */
        #master-footer { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; gap: 4px; padding: 0 10px; }
        .bar { display: flex; height: 50px; width: 100%; overflow: hidden; position: relative; border: 2px solid var(--main-red); border-radius: 4px; }
        .top-bg { background: var(--pure-white); }
        .bottom-bg { background: var(--main-red); }
        .box-left, .box-right { width: 50%; height: 100%; position: relative; display: flex; align-items: center; overflow: hidden; }
        .hint-label { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 25px; font-weight: 900; font-size: 36px; text-transform: uppercase; position: absolute; left: 0; top: 0; z-index: 100; }
        .hint-label::after { content: ""; position: absolute; right: -20px; top: 0; border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
        .hint-red { background: var(--main-red); color: var(--pure-white); }
        .hint-red::after { border-left: 20px solid var(--main-red); }
        .hint-white { background: var(--pure-white); color: var(--main-red); }
        .hint-white::after { border-left: 20px solid var(--pure-white); }
        marquee { width: 100%; font-size: 36px; font-weight: 900; text-transform: uppercase; padding-left: 130px; }
        .clock-area { position: absolute; right: 0; background: var(--pure-white); color: var(--main-red); min-width: 140px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; z-index: 110; border-left: 2px solid var(--main-red); }
        
        #watermark { position: fixed; color: #FFFFFF; font-size: 35px; font-weight: 900; z-index: 9999; text-shadow: 2px 2px 0px #000; text-transform: uppercase; }
        #contact-flasher { position: absolute; bottom: 120px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 6px 15px; border-radius: 5px; border-left: 4px solid var(--main-red); font-size: 36px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="watermark">SUKHDEEP TV</div>

    <div id="contact-flasher">
        <i id="fl-icon" class="fas fa-phone-alt"></i>
        <span id="fl-num">86996-40061</span>
    </div>

    <div id="scoreboard-wrapper">
        <div id="scoreboard-main-row">
            <div id="scoreboard-container">
                <div id="jA" class="jersey-strip"></div>
                <div class="score-unit side-a">
                    <div class="score-box" id="scoreA">0</div>
                    <div class="team-display-wrapper">
                        <div class="team-display" id="nameA">TEAM A</div>
                    </div>
                </div>
                <div class="score-unit side-b">
                    <div class="score-box" id="scoreB">0</div>
                    <div class="team-display-wrapper">
                        <div class="team-display" id="nameB" style="right: 5px;">TEAM B</div>
                    </div>
                </div>
                <div id="jB" class="jersey-strip"></div>
            </div>
            <div id="match-timer-box">00:00</div>
        </div>
        
        <div id="match-details">
            <span id="round-detail">ROUND: 1</span>
            <span id="half-detail">FIRST HALF</span>
        </div>
    </div>

    <div id="master-footer">
        <div class="bar top-bg">
            <div class="box-left"><div class="hint-label hint-red">LIVE</div><marquee id="tour-name">TOURNAMENT</marquee></div>
            <div class="box-right"><div class="hint-label hint-red">TEAMS</div><marquee id="scroll-top">UPCOMING</marquee></div>
        </div>
        <div class="bar bottom-bg">
            <div class="box-left"><div class="hint-label hint-white">INFO</div><marquee id="sub-info" style="color:white">LIVE COVERAGE</marquee></div>
            <div class="box-right"><div class="hint-label hint-white">PRIZES</div><marquee id="scroll-bot" style="color:white">UPDATING...</marquee><div class="clock-area" id="live-clock">00:00 AM</div></div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    function applyScroll(elId) {
        const el = document.getElementById(elId);
        const parent = el.parentElement;
        
        // Reset animation
        el.style.animation = 'none';
        el.style.transform = 'translateX(0)';

        setTimeout(() => {
            const diff = el.offsetWidth - parent.offsetWidth;
            if (diff > 0) {
                // If Team B, scroll should be negative to show right side
                const moveDist = (elId === 'nameB') ? diff : -diff;
                el.style.setProperty('--scroll-dist', moveDist + 'px');
                const speed = (el.offsetWidth / 30) + 2;
                el.style.animation = `scrollText ${speed}s linear infinite alternate`;
            }
        }, 200);
    }

    db.ref("matchData").on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('nameA').innerText = (d.nameA || "TEAM A").toUpperCase();
        document.getElementById('nameB').innerText = (d.nameB || "TEAM B").toUpperCase();
        
        // Call Scroll
        applyScroll('nameA');
        applyScroll('nameB');

        document.getElementById('scoreA').innerText = d.scoreA || "0";
        document.getElementById('scoreB').innerText = d.scoreB || "0";
        document.getElementById('round-detail').innerText = "ROUND: " + (d.matchRound || "1");
        document.getElementById('half-detail').innerText = (d.round || "FIRST HALF").toUpperCase();
        document.getElementById('jA').style.backgroundColor = d.colorA || "#cc0000";
        document.getElementById('jB').style.backgroundColor = d.colorB || "#ffffff";
        
        const timerBox = document.getElementById('match-timer-box');
        timerBox.style.display = d.timerRunning ? "flex" : "none";
        timerBox.innerText = d.matchTime || "00:00";
        document.getElementById('scoreboard-wrapper').style.display = (d.scoreVisible === false) ? 'none' : 'flex';
    });

    db.ref("tickerData").on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('tour-name').innerText = (d.tournamentName || "TOURNAMENT").toUpperCase();
        document.getElementById('scroll-top').innerText = (d.participatingTeams || "UPCOMING...").toUpperCase();
        document.getElementById('sub-info').innerText = (d.nextProgram || "LIVE COVERAGE").toUpperCase();
        document.getElementById('scroll-bot').innerText = ("🏆 " + (d.prizes || "UPDATING...")).toUpperCase();
        document.getElementById('watermark').innerText = (d.watermarkText || "SUKHDEEP TV").toUpperCase();
        document.getElementById('fl-num').innerText = d.contact || "86996-40061";
        document.getElementById('master-footer').style.display = (d.tickerVis === false) ? 'none' : 'flex';
    });

    // Simple Clock
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }, 1000);

    // Watermark Random Move
    function moveWM() {
        const wm = document.getElementById('watermark');
        wm.style.left = Math.random() * (window.innerWidth - 200) + 'px';
        wm.style.top = (Math.random() * 300 + 200) + 'px';
    }
    setInterval(moveWM, 8000);
    moveWM();
</script>
</body>
</html>
