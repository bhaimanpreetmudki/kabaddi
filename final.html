<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Sukhdeep TV - Pro Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --main-red: #cc0000;
            --pure-white: #ffffff;
            --pure-black: #000000;
            --container-width: 650px;
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: transparent; }

        /* --- Scoreboard Wrapper --- */
        #scoreboard-wrapper { position: absolute; top: 25px; left: 20px; display: flex; flex-direction: column; gap: 2px; z-index: 100; }
        #scoreboard-main-row { display: flex; align-items: flex-start; }
        
        #scoreboard-container { 
            display: flex; 
            width: var(--container-width); 
            border: 3px solid var(--pure-white); 
            border-radius: 6px; 
            overflow: hidden; 
            background: var(--pure-black); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); 
        }

        /* --- 50-50 Layout with Score at Edges --- */
        .team-box { flex: 1; height: 60px; display: flex; align-items: center; position: relative; }
        .side-a { background: var(--main-red); color: var(--pure-white); flex-direction: row; }
        .side-b { background: var(--pure-white); color: var(--main-red); flex-direction: row-reverse; }

        .score-box { 
            width: 80px; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 42px; 
            font-weight: 900; 
            background: rgba(0,0,0,0.2); 
            flex-shrink: 0;
        }

        .side-a .score-box { border-right: 2px solid white; }
        .side-b .score-box { border-left: 2px solid var(--main-red); }

        .name-wrapper { flex-grow: 1; overflow: hidden; white-space: nowrap; padding: 0 12px; display: flex; align-items: center; }
        .team-display { font-size: 34px; font-weight: 900; text-transform: uppercase; }

        /* --- Timer Box --- */
        #match-timer-box { 
            background: var(--main-red); color: white; height: 60px; display: none; align-items: center; 
            padding: 0 15px; font-size: 32px; font-weight: 900; border: 3px solid white; border-left: none; 
            border-radius: 0 6px 6px 0; box-shadow: 5px 5px 15px rgba(0,0,0,0.4); 
        }

        #match-details { display: flex; justify-content: space-between; padding: 0 5px; color: var(--pure-white); font-size: 24px; font-weight: 700; text-shadow: 2px 2px 4px #000; width: var(--container-width); }

        /* --- Ticker / Master Footer --- */
        #master-footer { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; gap: 4px; padding: 0 10px; z-index: 999; }
        .bar { display: flex; height: 50px; width: 100%; overflow: hidden; border: 2px solid var(--main-red); border-radius: 4px; }
        .top-bg { background: var(--pure-white); }
        .bottom-bg { background: var(--main-red); }
        .box-left, .box-right { width: 50%; height: 100%; display: flex; align-items: center; position: relative; overflow: hidden; }
        
        .hint-label { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 20px; font-weight: 900; font-size: 30px; text-transform: uppercase; z-index: 10; min-width: 80px; }
        .hint-red { background: var(--main-red); color: var(--pure-white); }
        .hint-white { background: var(--pure-white); color: var(--main-red); }
        
        marquee { width: 100%; font-size: 32px; font-weight: 900; text-transform: uppercase; }
        .clock-area { background: var(--pure-white); color: var(--main-red); min-width: 140px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; border-left: 2px solid var(--main-red); }

        /* Watermark & Flasher */
        #watermark { position: fixed; color: #FFFFFF; font-size: 35px; font-weight: 900; z-index: 9999; text-shadow: 2px 2px 0px #000; text-transform: uppercase; pointer-events: none; }
        #contact-flasher { position: absolute; bottom: 120px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 6px 15px; border-radius: 5px; border-left: 4px solid var(--main-red); font-size: 34px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="watermark">SUKHDEEP TV</div>

    <div id="contact-flasher">
        <i id="fl-icon" class="fas fa-phone-alt"></i>
        <span id="fl-num">86996-40061</span>
    </div>

    <div id="scoreboard-wrapper">
        <div id="scoreboard-main-row">
            <div id="scoreboard-container">
                <div class="team-box side-a">
                    <div class="score-box" id="scoreA">0</div>
                    <div class="name-wrapper"><div class="team-display" id="nameA">TEAM A</div></div>
                </div>
                <div class="team-box side-b">
                    <div class="score-box" id="scoreB">0</div>
                    <div class="name-wrapper" style="justify-content: flex-end;"><div class="team-display" id="nameB" style="text-align: right;">TEAM B</div></div>
                </div>
            </div>
            <div id="match-timer-box">00:00</div>
        </div>
        <div id="match-details">
            <span id="round-detail">ROUND: 1</span>
            <span id="half-detail">FIRST HALF</span>
        </div>
    </div>

    <div id="master-footer">
        <div class="bar top-bg">
            <div class="box-left"><div class="hint-label hint-red">LIVE</div><marquee id="tour-name">TOURNAMENT</marquee></div>
            <div class="box-right"><div class="hint-label hint-red">TEAMS</div><marquee id="scroll-top">UPCOMING</marquee></div>
        </div>
        <div class="bar bottom-bg">
            <div class="box-left"><div class="hint-label hint-white">INFO</div><marquee id="sub-info" style="color:white">LIVE COVERAGE</marquee></div>
            <div class="box-right"><div class="hint-label hint-white">PRIZES</div><marquee id="scroll-bot" style="color:white">UPDATING...</marquee><div class="clock-area" id="live-clock">00:00 AM</div></div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let localTimerInterval = null;

    // Match Sync
    db.ref("matchData").on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('nameA').innerText = (d.nameA || "TEAM A").toUpperCase();
        document.getElementById('nameB').innerText = (d.nameB || "TEAM B").toUpperCase();
        document.getElementById('scoreA').innerText = d.scoreA || "0";
        document.getElementById('scoreB').innerText = d.scoreB || "0";
        document.getElementById('round-detail').innerText = "ROUND: " + (d.matchRound || "1");
        document.getElementById('half-detail').innerText = (d.round || "FIRST HALF").toUpperCase();

        const timerBox = document.getElementById('match-timer-box');
        if (d.timerRunning && d.startTime) {
            timerBox.style.display = "flex";
            if (!localTimerInterval) {
                localTimerInterval = setInterval(() => {
                    const diff = Math.floor((Date.now() - d.startTime) / 1000);
                    let m = Math.floor(diff / 60), s = diff % 60;
                    timerBox.innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
                }, 1000);
            }
        } else {
            clearInterval(localTimerInterval); localTimerInterval = null;
            timerBox.innerText = d.matchTime || "00:00";
            if(!d.timerRunning) setTimeout(()=> { timerBox.style.display="none" }, 60000);
        }
        document.getElementById('scoreboard-wrapper').style.display = (d.scoreVisible === false) ? 'none' : 'flex';
    });

    // Ticker Sync
    db.ref("tickerData").on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('tour-name').innerText = (d.tournamentName || "TOURNAMENT").toUpperCase();
        document.getElementById('scroll-top').innerText = (d.participatingTeams || "UPCOMING...").toUpperCase();
        document.getElementById('sub-info').innerText = (d.nextProgram || "LIVE COVERAGE").toUpperCase();
        document.getElementById('scroll-bot').innerText = ("🏆 " + (d.prizes || "UPDATING...")).toUpperCase();
        document.getElementById('watermark').innerText = (d.watermarkText || "SUKHDEEP TV").toUpperCase();
        document.getElementById('fl-num').innerText = d.contact || "86996-40061";
        document.getElementById('master-footer').style.display = (d.tickerVis === false) ? 'none' : 'flex';
    });

    // Live Clock
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }, 1000);

    // Watermark Animation
    function moveWatermark() {
        const wm = document.getElementById('watermark');
        wm.style.left = Math.floor(Math.random() * (window.innerWidth - 300)) + 'px';
        wm.style.top = (Math.floor(Math.random() * (window.innerHeight - 300)) + 150) + 'px';
    }
    setInterval(moveWatermark, 7000);
    window.onload = moveWatermark;
</script>
</body>
</html>
