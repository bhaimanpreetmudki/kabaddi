<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Sukhdeep TV - Full Professional Scoreboard & Ticker</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --arrow-width: 25px;
            --arrow-height: 50px;
            --main-red: #cc0000;
            --pure-white: #ffffff;
            --pure-black: #000000;
            --container-width: 610px;
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: transparent; }

        /* Scoreboard Section */
        #scoreboard-wrapper { position: absolute; top: 25px; left: 20px; display: flex; flex-direction: column; gap: 2px; z-index: 100; }
        #scoreboard-main-row { display: flex; align-items: flex-start; }
        #scoreboard-container { display: flex; width: var(--container-width); border: 3px solid white; border-radius: 6px; overflow: hidden; background: black; box-shadow: 0 5px 15px rgba(0,0,0,0.6); }
        .jersey-strip { width: 12px; height: 60px; flex-shrink: 0; }
        .score-unit { display: flex; height: 60px; align-items: center; width: 50%; position: relative; overflow: hidden; }
        .team-display-wrapper { flex: 1; overflow: hidden; display: flex; align-items: center; height: 100%; padding: 0 10px; position: relative; }
        .team-display { font-size: 36px; font-weight: 900; text-transform: uppercase; white-space: nowrap; width: 100%; position: absolute; color: white; }
        .score-box { width: 75px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; z-index: 10; }
        .side-a { background: var(--main-red); color: white; border-right: 2px solid white; }
        .side-b { background: white; color: var(--main-red); border-left: 2px solid white; }

        /* Timer & Details */
        #match-timer-box { background: var(--main-red); color: white; height: 60px; display: none; align-items: center; padding: 0 15px; font-size: 32px; font-weight: 900; border: 3px solid white; border-left: none; border-radius: 0 6px 6px 0; }
        #match-details { display: flex; justify-content: space-between; padding: 0 5px; color: white; font-size: 26px; font-weight: 700; text-shadow: 2px 2px 4px #000; text-transform: uppercase; width: var(--container-width); }

        /* Footer Ticker System */
        #master-footer { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; gap: 4px; padding: 0 10px; z-index: 999; }
        .bar { display: flex; height: var(--arrow-height); width: 100%; overflow: hidden; position: relative; border: 2px solid var(--main-red); border-radius: 4px; }
        .top-bg { background: white; }
        .bottom-bg { background: var(--main-red); }
        .box-left, .box-right { width: 50%; height: 100%; position: relative; display: flex; align-items: center; overflow: hidden; }
        
        .hint-label { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 20px; font-weight: 900; font-size: 30px; text-transform: uppercase; position: absolute; left: 0; top: 0; z-index: 100; }
        .hint-red { background: var(--main-red); color: white; }
        .hint-white { background: white; color: var(--main-red); }
        
        marquee { width: 100%; font-size: 34px; font-weight: 900; text-transform: uppercase; padding-left: 110px; }
        .clock-area { position: absolute; right: 0; background: white; color: var(--main-red); min-width: 150px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; z-index: 110; border-left: 2px solid var(--main-red); }

        /* Goal & Watermark */
        #goal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 80vh; display: none; justify-content: center; align-items: center; z-index: 500; pointer-events: none; }
        .goal-text { font-size: 150px; color: #fff; font-weight: 900; text-shadow: 0 0 20px #ff0000; animation: scaleUp 0.5s infinite alternate; }
        @keyframes scaleUp { from { transform: scale(1); } to { transform: scale(1.1); } }
        #watermark { position: fixed; color: #FFFFFF; font-size: 35px; font-weight: 900; z-index: 9999; text-shadow: 2px 2px 0px #000; text-transform: uppercase; pointer-events: none; }
        
        /* Contact Flasher (Bottom Right) */
        #contact-flasher { position: absolute; bottom: 130px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 8px 15px; border-radius: 5px; border-left: 5px solid var(--main-red); font-size: 34px; font-weight: 900; display: flex; align-items: center; gap: 10px; z-index: 1001; }

        @keyframes marqueeScroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div id="goal-overlay"><div class="goal-text">GOAL !!!</div></div>
    <div id="watermark">SUKHDEEP TV</div>

    <div id="contact-flasher">
        <i id="fl-icon" class="fas fa-phone-alt"></i>
        <span id="fl-num">86996-40061</span>
    </div>

    <div id="scoreboard-wrapper">
        <div id="scoreboard-main-row">
            <div id="scoreboard-container">
                <div id="jA" class="jersey-strip"></div>
                <div class="score-unit side-a">
                    <div class="score-box" id="scoreA">0</div>
                    <div class="team-display-wrapper"><div class="team-display" id="nameA">TEAM A</div></div>
                </div>
                <div class="score-unit side-b">
                    <div class="team-display-wrapper"><div class="team-display" id="nameB" style="text-align: right;">TEAM B</div></div>
                    <div class="score-box" id="scoreB">0</div>
                </div>
                <div id="jB" class="jersey-strip"></div>
            </div>
            <div id="match-timer-box">00:00</div>
        </div>
        <div id="match-details">
            <span id="round-detail">ROUND: 1</span>
            <span id="half-detail">FIRST HALF</span>
        </div>
    </div>

    <div id="master-footer">
        <div class="bar top-bg">
            <div class="box-left"><div class="hint-label hint-red">LIVE</div><marquee id="tour-name">TOURNAMENT</marquee></div>
            <div class="box-right"><div class="hint-label hint-red">TEAMS</div><marquee id="scroll-top">UPCOMING...</marquee></div>
        </div>
        <div class="bar bottom-bg">
            <div class="box-left"><div class="hint-label hint-white">INFO</div><marquee id="sub-info" style="color:white">LIVE COVERAGE</marquee></div>
            <div class="box-right"><div class="hint-label hint-white">PRIZES</div><marquee id="scroll-bot" style="color:white">UPDATING...</marquee><div class="clock-area" id="live-clock">00:00 AM</div></div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let lastScoreA = 0, lastScoreB = 0;

    // --- SCOREBOARD DATA ---
    db.ref("matchData").on("value", (snap) => {
        const d = snap.val() || {};
        
        if (d.scoreA > lastScoreA || d.scoreB > lastScoreB) { triggerGoal(); }
        lastScoreA = d.scoreA || 0; lastScoreB = d.scoreB || 0;

        document.getElementById('nameA').innerText = (d.nameA || "TEAM A").toUpperCase();
        document.getElementById('nameB').innerText = (d.nameB || "TEAM B").toUpperCase();
        document.getElementById('scoreA').innerText = d.scoreA || "0";
        document.getElementById('scoreB').innerText = d.scoreB || "0";
        document.getElementById('round-detail').innerText = "ROUND: " + (d.matchRound || "1");
        document.getElementById('half-detail').innerText = (d.round || "FIRST HALF").toUpperCase();
        document.getElementById('jA').style.backgroundColor = d.colorA || "#cc0000";
        document.getElementById('jB').style.backgroundColor = d.colorB || "#ffffff";

        const timerBox = document.getElementById('match-timer-box');
        timerBox.style.display = d.timerRunning ? "flex" : "none";
        timerBox.innerText = d.matchTime || "00:00";
        
        document.getElementById('scoreboard-wrapper').style.display = (d.scoreVisible === false) ? 'none' : 'flex';
    });

    // --- TICKER DATA ---
    db.ref("tickerData").on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('tour-name').innerText = (d.tournamentName || "TOURNAMENT").toUpperCase();
        document.getElementById('scroll-top').innerText = (d.participatingTeams || "UPCOMING...").toUpperCase();
        document.getElementById('sub-info').innerText = (d.nextProgram || "LIVE COVERAGE").toUpperCase();
        document.getElementById('scroll-bot').innerText = ("🏆 " + (d.prizes || "UPDATING...")).toUpperCase();
        document.getElementById('watermark').innerText = (d.watermarkText || "SUKHDEEP TV").toUpperCase();
        document.getElementById('fl-num').innerText = d.contact || "86996-40061";
        document.getElementById('master-footer').style.display = (d.tickerVis === false) ? 'none' : 'flex';
    });

    // --- CONTACT FLASHER (WhatsApp/Phone) ---
    let isW = false;
    setInterval(() => {
        const icon = document.getElementById('fl-icon');
        const numSpan = document.getElementById('fl-num');
        db.ref("tickerData").once("value", (snap) => {
            const d = snap.val() || {};
            if (isW) {
                icon.className = "fab fa-whatsapp"; icon.style.color = "#25D366";
                numSpan.innerText = d.whatsapp || "86996-40061";
            } else {
                icon.className = "fas fa-phone-alt"; icon.style.color = "white";
                numSpan.innerText = d.contact || "86996-40061";
            }
            isW = !isW;
        });
    }, 10000);

    // --- UTILS ---
    function triggerGoal() {
        const overlay = document.getElementById('goal-overlay');
        overlay.style.display = 'flex';
        setTimeout(() => { overlay.style.display = 'none'; }, 3000);
    }

    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }, 1000);

    function moveWatermark() {
        const wm = document.getElementById('watermark');
        wm.style.left = Math.random() * (window.innerWidth - 250) + 'px';
        wm.style.top = (Math.random() * (window.innerHeight - 400) + 150) + 'px';
    }
    setInterval(moveWatermark, 10000);
    window.onload = moveWatermark;
</script>
</body>
</html>
