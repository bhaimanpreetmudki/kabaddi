<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Sukhdeep TV - Pro Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-red: #cc0000;
            --pure-white: #ffffff;
            --pure-black: #000000;
            --container-width: 700px; /* 50-50 ਲਈ ਚੌੜਾਈ ਥੋੜੀ ਵਧਾਈ ਹੈ */
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: transparent; }

        #scoreboard-wrapper { position: absolute; top: 25px; left: 20px; display: flex; flex-direction: column; gap: 2px; }
        
        #scoreboard-main-row { display: flex; align-items: flex-start; }
        
        #scoreboard-container { 
            display: flex; 
            width: var(--container-width); 
            border: 3px solid var(--pure-white); 
            border-radius: 6px; 
            overflow: hidden; 
            background: var(--pure-black); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); 
        }

        /* --- 50-50 Team Boxes --- */
        .team-box {
            flex: 1; /* ਦੋਵੇਂ ਪਾਸੇ ਬਰਾਬਰ 50% ਜਗ੍ਹਾ ਲੈਣਗੇ */
            height: 65px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .side-a { background: var(--main-red); color: var(--pure-white); flex-direction: row-reverse; }
        .side-b { background: var(--pure-white); color: var(--main-red); flex-direction: row; }

        /* --- Name Scrolling --- */
        .name-wrapper {
            flex-grow: 1;
            overflow: hidden;
            white-space: nowrap;
            padding: 0 15px;
            display: flex;
            align-items: center;
        }

        .team-display {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            display: inline-block;
        }

        .scroll-active {
            animation: marquee 5s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* --- Score & Divider --- */
        .score-section {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: 900;
            min-width: 80px;
            height: 100%;
        }

        .divider {
            font-size: 35px;
            color: rgba(255, 255, 255, 0.4); /* ਹਲਕਾ ਡਿਵਾਈਡਰ */
            padding: 0 5px;
            font-weight: 300;
        }

        .side-b .divider { color: rgba(204, 0, 0, 0.3); }

        /* Timer Box */
        #match-timer-box { 
            background: var(--main-red); 
            color: white; 
            height: 65px; 
            display: none; 
            align-items: center; 
            padding: 0 15px; 
            font-size: 34px; 
            font-weight: 900; 
            border: 3px solid white; 
            border-left: none; 
            border-radius: 0 6px 6px 0; 
        }

        #match-details { display: flex; justify-content: space-between; padding: 0 5px; color: var(--pure-white); font-size: 24px; font-weight: 700; text-shadow: 2px 2px 4px #000; width: var(--container-width); }
    </style>
</head>
<body>

    <div id="scoreboard-wrapper">
        <div id="scoreboard-main-row">
            <div id="scoreboard-container">
                
                <div class="team-box side-a" id="bgA">
                    <div class="score-section">
                        <span id="scoreA">0</span>
                        <span class="divider">|</span>
                    </div>
                    <div class="name-wrapper">
                        <div class="team-display" id="nameA">TEAM A</div>
                    </div>
                </div>

                <div class="team-box side-b" id="bgB">
                    <div class="score-section">
                        <span class="divider">|</span>
                        <span id="scoreB">0</span>
                    </div>
                    <div class="name-wrapper">
                        <div class="team-display" id="nameB">TEAM B</div>
                    </div>
                </div>

            </div>
            <div id="match-timer-box">00:00</div>
        </div>
        
        <div id="match-details">
            <span id="round-detail">ROUND: 1</span>
            <span id="half-detail">FIRST HALF</span>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localTimerInterval = null;

    db.ref("matchData").on("value", (snap) => {
        const d = snap.val() || {};
        
        // ਸਕੋਰ ਅਤੇ ਨਾਮ ਅਪਡੇਟ
        document.getElementById('scoreA').innerText = d.scoreA || "0";
        document.getElementById('scoreB').innerText = d.scoreB || "0";
        
        updateNameAndScroll('nameA', d.nameA || "TEAM A");
        updateNameAndScroll('nameB', d.nameB || "TEAM B");

        // ਰੰਗ ਸੈਟਿੰਗ (ਜਰਸੀ ਸਟ੍ਰਿਪ ਦੀ ਜਗ੍ਹਾ ਹੁਣ ਬਾਰਡਰ ਵਰਤਿਆ ਹੈ)
        document.getElementById('bgA').style.borderLeft = `10px solid ${d.colorA || '#cc0000'}`;
        document.getElementById('bgB').style.borderRight = `10px solid ${d.colorB || '#ffffff'}`;

        document.getElementById('round-detail').innerText = "ROUND: " + (d.matchRound || "1");
        document.getElementById('half-detail').innerText = (d.round || "FIRST HALF").toUpperCase();

        // ਸਮਾਰਟ ਟਾਈਮਰ
        const timerBox = document.getElementById('match-timer-box');
        if (d.timerRunning && d.startTime) {
            timerBox.style.display = "flex";
            if (!localTimerInterval) {
                localTimerInterval = setInterval(() => {
                    const diff = Math.floor((Date.now() - d.startTime) / 1000);
                    let m = Math.floor(diff / 60), s = diff % 60;
                    timerBox.innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
                }, 1000);
            }
        } else {
            clearInterval(localTimerInterval);
            localTimerInterval = null;
            timerBox.innerText = d.matchTime || "00:00";
            // ਜੇ ਟਾਈਮਰ ਬੰਦ ਹੈ ਤਾਂ 1 ਮਿੰਟ ਬਾਅਦ ਆਪਣੇ ਆਪ ਛੁਪ ਜਾਵੇਗਾ
            setTimeout(() => { if(!d.timerRunning) timerBox.style.display = "none"; }, 60000);
        }

        document.getElementById('scoreboard-wrapper').style.display = (d.scoreVisible === false) ? 'none' : 'flex';
    });

    function updateNameAndScroll(id, name) {
        const el = document.getElementById(id);
        el.innerText = name.toUpperCase();
        const parent = el.parentElement;
        
        // ਜੇ ਨਾਮ ਬਾਕਸ ਤੋਂ ਵੱਡਾ ਹੈ ਤਾਂ ਸਕ੍ਰੋਲ ਚਲਾਓ
        if (el.offsetWidth > parent.offsetWidth) {
            el.classList.add('scroll-active');
        } else {
            el.classList.remove('scroll-active');
        }
    }
</script>
</body>
</html>
