<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Sukhdeep TV - Live Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: transparent; }
        
        #overlay-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Scoreboard Style */
        .score-box {
            display: flex;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            border-bottom: 4px solid #cc0000;
            font-weight: bold;
            font-size: 24px;
        }

        .team { display: flex; align-items: center; gap: 10px; }
        .score { font-size: 32px; color: #f1c40f; padding: 0 15px; }
        
        .timer-box {
            background: #cc0000;
            color: white;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 5px;
            font-size: 24px;
            min-width: 80px;
            text-align: center;
            font-family: monospace;
        }

        /* Penalty Section */
        #penalty-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            display: none;
            color: white;
            border-top: 4px solid #f39c12;
        }
        .penalty-row { font-size: 20px; margin: 5px 0; letter-spacing: 3px; }
    </style>
</head>
<body>

<div id="overlay-container">
    <div class="score-box">
        <div class="team">
            <span id="nameA">TEAM A</span>
            <span class="score" id="dispA">0</span>
        </div>
        <div style="border-left: 2px solid #555; margin: 0 15px;"></div>
        <div class="team">
            <span class="score" id="dispB">0</span>
            <span id="nameB">TEAM B</span>
        </div>
    </div>
    <div class="timer-box" id="timerShow">00:00</div>
</div>

<div id="penalty-overlay">
    <div style="text-align:center; font-weight:bold; color:#f39c12; margin-bottom:10px;">PENALTY SHOOTOUT</div>
    <div class="penalty-row">A: <span id="pA"></span></div>
    <div class="penalty-row">B: <span id="pB"></span></div>
</div>

<script>
    // ਫਾਇਰਬੇਸ ਕਨਫਿਗਰੇਸ਼ਨ - ਇਹ ਤੁਹਾਡੇ ਪੈਨਲ ਵਾਲੀ ਹੀ ਹੈ
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const matchRef = firebase.database().ref("matchData");

    let serverStartTime = 0;
    let serverElapsed = 0;
    let serverIsPaused = true;

    // ਡਾਟਾ ਰੀਡ ਕਰਨਾ
    matchRef.on("value", (snap) => {
        const data = snap.val() || {};
        
        // ਸਕੋਰ ਅਤੇ ਨਾਮ
        document.getElementById('dispA').innerText = data.scoreA || 0;
        document.getElementById('dispB').innerText = data.scoreB || 0;
        document.getElementById('nameA').innerText = (data.nameA || "TEAM A").toUpperCase();
        document.getElementById('nameB').innerText = (data.nameB || "TEAM B").toUpperCase();
        
        // ਵਿਜ਼ੀਬਿਲਟੀ (ਦਿਖਾਉਣਾ ਜਾਂ ਛੁਪਾਉਣਾ)
        document.getElementById('overlay-container').style.opacity = data.scoreVisible ? "1" : "0";
        document.getElementById('penalty-overlay').style.display = data.penaltyVisible ? "block" : "none";
        
        // ਪੈਨਲਟੀ ਡਾਟਾ
        document.getElementById('pA').innerText = data.penaltyA || "";
        document.getElementById('pB').innerText = data.penaltyB || "";

        // ਟਾਈਮਰ ਡਾਟਾ ਅਪਡੇਟ
        serverStartTime = data.startTime || 0;
        serverElapsed = data.elapsedTime || 0;
        serverIsPaused = (data.isPaused !== false);
    });

    // ਟਾਈਮਰ ਡਿਸਪਲੇਅ ਲੋਜਿਕ (ਹਰ ਸੈਕਿੰਡ ਚੱਲੇਗਾ)
    setInterval(() => {
        let totalSeconds = 0;
        
        if (!serverIsPaused && serverStartTime > 0) {
            // ਜੇਕਰ ਟਾਈਮਰ ਚੱਲ ਰਿਹਾ ਹੈ: (ਹੁਣ ਦਾ ਟਾਈਮ - ਸਟਾਰਟ ਟਾਈਮ) + ਪੁਰਾਣਾ ਬਚਿਆ ਸਮਾਂ
            totalSeconds = Math.floor((Date.now() - serverStartTime) / 1000) + serverElapsed;
        } else {
            // ਜੇਕਰ ਰੁਕਿਆ ਹੋਇਆ ਹੈ: ਸਿਰਫ ਪੁਰਾਣਾ ਸੇਵ ਕੀਤਾ ਸਮਾਂ
            totalSeconds = serverElapsed;
        }

        const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const secs = (totalSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timerShow').innerText = `${mins}:${secs}`;
    }, 1000);
</script>

</body>
</html>
