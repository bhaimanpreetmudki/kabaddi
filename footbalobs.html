<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Sukhdeep TV - Final Fixed Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #cc0000; --pure-white: #ffffff; --container-width: 610px; }
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: transparent; }
        
        #scoreboard-wrapper { position: absolute; top: 25px; left: 20px; display: flex; flex-direction: column; gap: 2px; }
        #scoreboard-container { display: flex; width: var(--container-width); border: 3px solid white; border-radius: 6px; overflow: hidden; background: black; box-shadow: 0 5px 15px rgba(0,0,0,0.6); }
        
        .score-unit { display: flex; height: 60px; align-items: center; flex-grow: 1; }
        .team-display { flex-grow: 1; padding: 0 15px; font-size: 36px; font-weight: 900; text-transform: uppercase; }
        .score-box { width: 75px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; }
        
        .side-a { background: var(--main-red); color: white; border-right: 2px solid white; }
        .side-b { background: white; color: var(--main-red); }

        #match-timer-box { 
            background: var(--main-red); color: white; height: 60px; 
            display: flex; align-items: center; padding: 0 15px; 
            font-size: 32px; font-weight: 900; border: 3px solid white; 
            border-left: none; border-radius: 0 6px 6px 0; 
        }

        #watermark { position: fixed; color: white; font-size: 35px; font-weight: 900; text-shadow: 2px 2px 0 #000; z-index: 9999; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="watermark">SUKHDEEP TV</div>

    <div id="scoreboard-wrapper">
        <div style="display: flex; align-items: flex-start;">
            <div id="scoreboard-container">
                <div class="score-unit side-a">
                    <div class="score-box" id="scoreA">0</div>
                    <div class="team-display" id="nameA">TEAM A</div>
                </div>
                <div class="score-unit side-b">
                    <div class="team-display" id="nameB" style="text-align: right;">TEAM B</div>
                    <div class="score-box" id="scoreB">0</div>
                </div>
            </div>
            <div id="match-timer-box">00:00</div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ਟਾਈਮਰ ਲਈ ਵੱਖਰੇ ਵੇਰੀਏਬਲ
    let serverStartTime = 0;
    let serverElapsed = 0;
    let serverIsPaused = true;

    // 1. ਸਿਰਫ਼ ਸਕੋਰ ਅਤੇ ਨਾਮ ਅਪਡੇਟ ਕਰਨ ਲਈ
    db.ref("matchData").on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('nameA').innerText = (d.nameA || "TEAM A").toUpperCase();
        document.getElementById('nameB').innerText = (d.nameB || "TEAM B").toUpperCase();
        document.getElementById('scoreA').innerText = d.scoreA || "0";
        document.getElementById('scoreB').innerText = d.scoreB || "0";
        
        // ਟਾਈਮਰ ਦਾ ਡਾਟਾ ਸਰਵਰ ਤੋਂ ਲੈਣਾ
        serverStartTime = d.startTime || 0;
        serverElapsed = d.elapsedTime || 0;
        serverIsPaused = (d.isPaused !== false); 

        document.getElementById('match-timer-box').style.display = (d.timerVisible === false) ? "none" : "flex";
    });

    // 2. ਟਾਈਮਰ ਲੋਜਿਕ - ਜੋ ਕਦੇ ਨਹੀਂ ਰੁਕੇਗਾ (ਚਾਹੇ ਮੋਬਾਈਲ ਲੌਕ ਹੋਵੇ ਜਾਂ ਸਕੋਰ ਅਪਡੇਟ ਹੋਵੇ)
    setInterval(() => {
        let displaySeconds = 0;
        
        if (!serverIsPaused && serverStartTime > 0) {
            // ਜੇ ਮੈਚ ਚੱਲ ਰਿਹਾ ਹੈ: (ਹੁਣ ਦਾ ਟਾਈਮ - ਸ਼ੁਰੂਆਤੀ ਟਾਈਮ) + ਪਹਿਲਾਂ ਬੀਤਿਆ ਸਮਾਂ
            const now = Date.now();
            const sessionSeconds = Math.floor((now - serverStartTime) / 1000);
            displaySeconds = sessionSeconds + serverElapsed;
        } else {
            // ਜੇ ਮੈਚ ਪਾਜ਼ ਹੈ: ਸਿਰਫ਼ ਬੀਤਿਆ ਹੋਇਆ ਸਮਾਂ ਦਿਖਾਓ
            displaySeconds = serverElapsed;
        }

        if (displaySeconds < 0) displaySeconds = 0;

        const mins = Math.floor(displaySeconds / 60).toString().padStart(2, '0');
        const secs = (displaySeconds % 60).toString().padStart(2, '0');
        document.getElementById('match-timer-box').innerText = `${mins}:${secs}`;
    }, 1000);

    // ਵਾਟਰਮਾਰਕ ਮੂਵਮੈਂਟ
    function moveWatermark() {
        const wm = document.getElementById('watermark');
        wm.style.left = Math.random() * (window.innerWidth - 200) + 'px';
        wm.style.top = Math.random() * (window.innerHeight - 100) + 'px';
    }
    setInterval(moveWatermark, 10000);
    window.onload = moveWatermark;
</script>
</body>
</html>
