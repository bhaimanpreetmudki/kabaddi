<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Admin - Score & Ticker</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0d0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #161b22; width: 100%; max-width: 500px; border-radius: 12px; border: 1px solid #30363d; overflow: hidden; margin-bottom: 12px; box-sizing: border-box; }
        .header { background: #238636; color: white; padding: 8px; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .teams-container { display: flex; padding: 10px; gap: 5px; background: #0d1117; align-items: center; }
        .team-box { flex: 2; text-align: center; padding: 10px; border-radius: 8px; background: #161b22; border-top: 4px solid #fff; }
        .mid-controls { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .score-val { font-size: 38px; font-weight: 900; color: #2ecc71; margin: 2px 0; }
        .btn-pm { border: none; color: white; padding: 5px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer; flex: 1; margin: 0 2px; }
        .card-btn { padding: 8px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 9px; flex: 1; width: 100%; }
        .std-input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; }
        .std-textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; min-height: 80px; resize: none; }
        .label-text, .label-title { font-size: 10px; color: #8b949e; display: block; margin-top: 5px; text-align: left; text-transform: uppercase; font-weight: bold; }
        .content { padding: 15px; }
        .btn-update { background: #1a73e8; color: white; padding: 12px; border-radius: 6px; border:none; cursor:pointer; width:100%; font-weight:bold; margin-bottom: 10px;}
        .btn-ticker { background: #ff5722; color: white; margin-bottom: 15px; height: 50px; font-size: 16px; border-radius: 6px; border:none; width:100%; font-weight:bold; cursor:pointer; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .flex-row { display: flex; gap: 5px; margin-top: 8px; }
        #penaltyControlSection { display: none; background: #1c2128; padding: 15px; border-top: 3px solid #f39c12; }
        .card-record-box { margin-top: 8px; padding: 5px; background: #0d1117; border-radius: 4px; font-size: 10px; min-height: 25px; border: 1px dashed #444; color: #f1c40f; }
    </style>
</head>
<body>

<div id="main-content" style="width: 100%; max-width: 500px;">
    <div class="card">
        <div class="header"><i class="fas fa-futbol"></i> Scoreboard</div>
        <div class="teams-container">
            <div class="team-box" id="boxA">
                <input type="color" id="colorA" oninput="updateMatchDB()" style="width:100%; height:18px; border:none; cursor:pointer;">
                <input type="text" id="nameA" class="std-input" placeholder="Home Team" oninput="updateMatchDB()">
                <div class="score-val" id="dispA">0</div>
                <div style="display:flex; margin-bottom:5px;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreA', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreA', 1)">+</button>
                </div>
                <input type="text" id="playerA" class="std-input" placeholder="No" style="border-color:#f1c40f;">
                <div class="grid-2">
                    <button class="card-btn" style="background:#f1c40f; color:#000;" onclick="handleCard('A', 'Yellow')">YC</button>
                    <button class="card-btn" style="background:#e74c3c;" onclick="handleCard('A', 'Red')">RC</button>
                </div>
                <div id="cardRecordA" class="card-record-box">-</div>
            </div>

            <div class="mid-controls">
                <button id="visBtn" class="card-btn" onclick="toggleVis('scoreVisible')">SHOW</button>
                <button class="card-btn" style="background:#333;" onclick="resetOnlyScore()">RESET</button>
                <div style="font-weight:bold; color:#444;">VS</div>
            </div>

            <div class="team-box" id="boxB">
                <input type="color" id="colorB" oninput="updateMatchDB()" style="width:100%; height:18px; border:none; cursor:pointer;">
                <input type="text" id="nameB" class="std-input" placeholder="Away Team" oninput="updateMatchDB()">
                <div class="score-val" id="dispB">0</div>
                <div style="display:flex; margin-bottom:5px;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreB', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreB', 1)">+</button>
                </div>
                <input type="text" id="playerB" class="std-input" placeholder="No" style="border-color:#f1c40f;">
                <div class="grid-2">
                    <button class="card-btn" style="background:#f1c40f; color:#000;" onclick="handleCard('B', 'Yellow')">YC</button>
                    <button class="card-btn" style="background:#e74c3c;" onclick="handleCard('B', 'Red')">RC</button>
                </div>
                <div id="cardRecordB" class="card-record-box">-</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header">Timer Control</div>
        <div style="padding:15px; background:#0d1117; text-align:center;">
            <div id="timerShow" style="font-size:48px; color:#f1c40f; font-family:monospace; margin-bottom:10px;">00:00</div>
            <div class="grid-2">
                <button id="mainTimerBtn" class="btn-update" style="background:#238636;" onclick="toggleTimer()">START</button>
                <button class="btn-update" style="background:#333;" onclick="resetTimer()">RESET 00</button>
            </div>
            <div class="grid-2">
                <input type="text" id="matchRound" class="std-input" placeholder="Semi-Final" oninput="updateMatchDB()">
                <input type="text" id="roundInp" class="std-input" placeholder="1st Half" oninput="updateMatchDB()">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header">Ticker & Teams</div>
        <div class="content">
            <button id="tickerToggleBtn" class="btn-ticker" onclick="confirmTickerAction('vis')">Ticker: ON/OFF</button>
            <span class="label-title">Tournament Name</span>
            <input type="text" id="tourName" class="std-input">
            <span class="label-title">Team List (Continuous Numbered)</span>
            <textarea id="teamsList" class="std-textarea" placeholder="1. TEAM A 2. TEAM B 3. TEAM C..."></textarea>
            <button class="btn-update" style="background: #238636;" onclick="confirmTickerAction('info')">Update Info</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    
    const matchRef = firebase.database().ref("matchData");
    const tickerRef = firebase.database().ref("tickerData");

    let timerInterval = null, seconds = 0, curA = 0, curB = 0, sVis = true;
    let tickerStatus = true;

    // --- Core Database Sync ---
    function updateMatchDB() {
        matchRef.update({
            nameA: document.getElementById('nameA').value.toUpperCase(),
            nameB: document.getElementById('nameB').value.toUpperCase(),
            colorA: document.getElementById('colorA').value,
            colorB: document.getElementById('colorB').value,
            matchRound: document.getElementById('matchRound').value.toUpperCase(),
            round: document.getElementById('roundInp').value.toUpperCase()
        });
    }

    // --- Score Control ---
    function changeScore(team, val) {
        let current = (team === 'scoreA' ? curA : curB);
        matchRef.update({ [team]: Math.max(0, current + val) });
    }

    // --- Card Handling ---
    function handleCard(team, type) {
        let pNo = document.getElementById('player' + team).value;
        if(!pNo) { alert("Player No. ਭਰੋ!"); return; }
        let msg = (type === 'Yellow' ? "YC: " : "RC: ") + pNo;
        matchRef.child('cardRecord' + team).set(msg);
        matchRef.child('lastEvent').set(msg + " (" + (team === 'A' ? "Home" : "Away") + ")");
    }

    // --- Timer Logic (Sync across all devices) ---
    function toggleTimer() {
        if (timerInterval) {
            pauseTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        const startTime = Date.now() - (seconds * 1000);
        matchRef.update({ timerRunning: true, startTime: startTime });
    }

    function pauseTimer() {
        matchRef.update({ timerRunning: false, savedSeconds: seconds });
    }

    function resetTimer() {
        seconds = 0;
        matchRef.update({ timerRunning: false, startTime: null, savedSeconds: 0, matchTime: "00:00" });
    }

    // --- Ticker Controls ---
    function confirmTickerAction(type) {
        if (confirm("Update ਕਰੀਏ?")) {
            if (type === 'info') {
                tickerRef.update({ 
                    tournamentName: document.getElementById('tourName').value.toUpperCase(),
                    participatingTeams: document.getElementById('teamsList').value.toUpperCase()
                });
            } else if (type === 'vis') {
                tickerRef.child('tickerVis').set(!tickerStatus);
            }
        }
    }

    function toggleVis(field) { matchRef.child(field).set(!sVis); }
    function resetOnlyScore() { if(confirm("Score Reset?")) matchRef.update({ scoreA: 0, scoreB: 0, cardRecordA: "-", cardRecordB: "-" }); }

    // --- Data Listeners ---
    matchRef.on("value", (snap) => {
        const data = snap.val() || {};
        curA = data.scoreA || 0; curB = data.scoreB || 0;
        sVis = !!data.scoreVisible;
        
        document.getElementById('dispA').innerText = curA;
        document.getElementById('dispB').innerText = curB;
        document.getElementById('nameA').value = data.nameA || "";
        document.getElementById('nameB').value = data.nameB || "";
        document.getElementById('colorA').value = data.colorA || "#ffffff";
        document.getElementById('colorB').value = data.colorB || "#ffffff";
        document.getElementById('matchRound').value = data.matchRound || "";
        document.getElementById('roundInp').value = data.round || "";
        document.getElementById('cardRecordA').innerText = data.cardRecordA || "-";
        document.getElementById('cardRecordB').innerText = data.cardRecordB || "-";
        
        document.getElementById('visBtn').innerText = sVis ? "HIDE" : "SHOW";
        document.getElementById('visBtn').style.background = sVis ? "#da3633" : "#238636";

        // Timer Sync Logic
        clearInterval(timerInterval);
        timerInterval = null;
        if (data.timerRunning && data.startTime) {
            document.getElementById('mainTimerBtn').innerText = "STOP";
            document.getElementById('mainTimerBtn').style.background = "#da3633";
            timerInterval = setInterval(() => {
                seconds = Math.floor((Date.now() - data.startTime) / 1000);
                let m = Math.floor(seconds / 60), s = seconds % 60;
                let timeStr = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
                document.getElementById('timerShow').innerText = timeStr;
                matchRef.child('matchTime').set(timeStr);
            }, 1000);
        } else {
            seconds = data.savedSeconds || 0;
            let m = Math.floor(seconds / 60), s = seconds % 60;
            document.getElementById('timerShow').innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
            document.getElementById('mainTimerBtn').innerText = "START";
            document.getElementById('mainTimerBtn').style.background = "#238636";
        }
    });

    tickerRef.on("value", (snap) => {
        const data = snap.val() || {};
        document.getElementById('tourName').value = data.tournamentName || "";
        document.getElementById('teamsList').value = data.participatingTeams || "";
        tickerStatus = !!data.tickerVis;
        document.getElementById('tickerToggleBtn').style.background = tickerStatus ? "#238636" : "#da3633";
        document.getElementById('tickerToggleBtn').innerText = tickerStatus ? "Ticker: SHOWING" : "Ticker: HIDDEN";
    });
</script>
</body>
</html>
