<script>
    // ==========================
// FIREBASE
// ==========================
const firebaseConfig = {
    databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();

// ==========================
// UNIQUE USER ID SYSTEM
// ==========================
const params = new URLSearchParams(window.location.search);
const userID = params.get("id") || "default_user";

console.log("USER ID =", userID);

const matchRef = db.ref("users/" + userID + "/matchData");
const tickerRef = db.ref("users/" + userID + "/tickerData");

// ==========================
// VARIABLES
// ==========================
let localSecs = 0;
let timerInt = null;
let lastScoreA = 0;
let lastScoreB = 0;

// ==========================
// MATCH DATA
// ==========================
matchRef.on("value", (snap) => {

    const d = snap.val() || {};

    if ((d.scoreA || 0) > lastScoreA || (d.scoreB || 0) > lastScoreB) {
        triggerGoal();
    }

    lastScoreA = d.scoreA || 0;
    lastScoreB = d.scoreB || 0;

    document.getElementById("nameA").innerText =
        (d.nameA || "TEAM A").toUpperCase();

    document.getElementById("nameB").innerText =
        (d.nameB || "TEAM B").toUpperCase();

    document.getElementById("scoreA").innerText =
        d.scoreA || 0;

    document.getElementById("scoreB").innerText =
        d.scoreB || 0;

    document.getElementById("round-detail").innerText =
        "ROUND: " + (d.matchRound || "1");

    document.getElementById("half-detail").innerText =
        (d.round || "FIRST HALF").toUpperCase();

    document.getElementById("jA").style.backgroundColor =
        d.colorA || "#cc0000";

    document.getElementById("jB").style.backgroundColor =
        d.colorB || "#ffffff";

// Scoreboard ਲਈ (ਸਕ੍ਰੋਲਿੰਗ ਵਾਲਾ ਫੰਕਸ਼ਨ)
setTeamName("nameA", d.nameA || "TEAM A");
setTeamName("nameB", d.nameB || "TEAM B");

// Penalty Board ਲਈ (ਬਿਨਾਂ ਸਕ੍ਰੋਲਿੰਗ, ਸਿੱਧਾ ਨਾਮ)
document.getElementById("pNameA").innerText = (d.nameA || "TEAM A").toUpperCase();
document.getElementById("pNameB").innerText = (d.nameB || "TEAM B").toUpperCase();

    // CARD A
    const cardA = document.getElementById("cardA");
    cardA.className = "card-indicator";

    if (d.cardA === "yellow") {
        cardA.classList.add("yellow-card");
    }
    else if (d.cardA === "red") {
        cardA.classList.add("red-card");
    }

    // CARD B
    const cardB = document.getElementById("cardB");
    cardB.className = "card-indicator";

    if (d.cardB === "yellow") {
        cardB.classList.add("yellow-card");
    }
    else if (d.cardB === "red") {
        cardB.classList.add("red-card");
    }

    // TIMER
    let serverTime = d.matchTime || "00:00";

    let parts = serverTime.split(":");

    let serverSecs =
        (parseInt(parts[0]) * 60) +
        parseInt(parts[1]);

    if (Math.abs(serverSecs - localSecs) > 2) {
        localSecs = serverSecs;
    }

    if (d.timerRunning) {

        if (!timerInt) {

            timerInt = setInterval(() => {

                localSecs++;
                updateTimerUI();

            }, 1000);
        }

    } else {

        clearInterval(timerInt);
        timerInt = null;
        updateTimerUI();
    }

    // PENALTIES
    renderPenalties("penaltyA", d.pA);
    renderPenalties("penaltyB", d.pB);

    // SHOW HIDE PENALTY BOARD
    if (d.penaltyVisible) {

        document.getElementById("scoreboard-container").style.display = "none";
        document.getElementById("match-details").style.display = "none";
        document.getElementById("penalty-board").style.display = "block";

    } else {

        document.getElementById("scoreboard-container").style.display = "flex";
        document.getElementById("match-details").style.display = "flex";
        document.getElementById("penalty-board").style.display = "none";
    }

    document.getElementById("scoreboard-wrapper").style.display =
        d.scoreVisible === false ? "none" : "flex";
});

// ==========================
// TIMER UI
// ==========================

 function setTeamName(id, txt) {
    const el = document.getElementById(id);
    if (!el) return;
    
    txt = (txt || "").toUpperCase();
    
    // ਜੇ 8 ਅੱਖਰਾਂ ਤੋਂ ਵੱਡਾ ਹੈ
    if (txt.length > 8) {
        el.innerHTML = `
            <div class="team-scroll">
                ${txt} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </div>`;
    } else {
        el.innerHTML = `<div class="team-static">${txt}</div>`;
    }
}
  
function updateTimerUI() {

    let m = Math.floor(localSecs / 60);
    let s = localSecs % 60;

    document.getElementById("match-timer-box").innerText =
        (m < 10 ? "0" + m : m) +
        ":" +
        (s < 10 ? "0" + s : s);

    document.getElementById("match-timer-box").style.display =
        localSecs > 0 ? "flex" : "none";
}

// ==========================
// PENALTY RENDER
// ==========================
function renderPenalties(containerId, penaltyString) {

    const container = document.getElementById(containerId);

    if (!container) return;

    container.innerHTML = "";

    penaltyString = penaltyString || "";

    const shots = [...penaltyString].filter(
        v => v === "✅" || v === "❌"
    );

    const totalGoals =
        shots.filter(v => v === "✅").length;

    const currentRound =
        Math.floor(Math.max(0, shots.length - 1) / 5);

    const roundShots =
        shots.slice(currentRound * 5, currentRound * 5 + 5);

    for (let i = 0; i < 5; i++) {

        const box = document.createElement("div");
        box.className = "ball";

        if (roundShots[i] === "✅") {

            box.className = "ball goal";
            box.innerHTML = "✓";

        } else if (roundShots[i] === "❌") {

            box.className = "ball miss";
            box.innerHTML = "✕";
        }

        container.appendChild(box);
    }

    if (containerId === "penaltyA") {
        document.getElementById("pScoreA").innerText = totalGoals;
    } else {
        document.getElementById("pScoreB").innerText = totalGoals;
    }
}

// ==========================
// TICKER DATA
// ==========================
tickerRef.on("value", (snap) => {
    const d = snap.val() || {};

    document.getElementById("tour-name").textContent = d.tournamentName || "TOURNAMENT";
    document.getElementById("scroll-top").textContent = d.participatingTeams || "UPCOMING";
    document.getElementById("sub-info").textContent = d.nextProgram || "LIVE COVERAGE";
    document.getElementById("scroll-bot").textContent = "🏆 " + (d.prizes || "UPDATING");

    

    document.getElementById("watermark").innerText =
        (d.watermarkText || "SUKHDEEP TV").toUpperCase();

    document.getElementById("fl-num").innerText =
        d.contact || "86996-40061";

    document.getElementById("master-footer").style.display =
        d.tickerVis === false ? "none" : "flex";
});

 // ਡਾਟਾ ਅਪਡੇਟ ਹੋਣ ਤੋਂ ਬਾਅਦ ਟਿੱਕਰ ਚਲਾਓ
    setTimeout(startTicker, 500); 
});

// ਸਟਾਰਟ ਟਿੱਕਰ ਫੰਕਸ਼ਨ
function startTicker() {
    document.querySelectorAll(".ticker-scroll").forEach(el => {
        const textWidth = el.scrollWidth;
        const speed = 60; // ਸਪੀਡ ਇੱਥੇ ਘਟਾ-ਵਧਾ ਸਕਦੇ ਹੋ
        const duration = textWidth / speed;

        el.style.animation = `scroll-text ${duration}s linear infinite`;
    });
}
    // --- Flasher Logic Fixed ---
    let isW = false;
    setInterval(() => {
        const icon = document.getElementById('fl-icon');
        const numSpan = document.getElementById('fl-num');
        tickerRef.once("value", (snap) => {
            const d = snap.val() || {};
            if (isW) {
                icon.className = "fab fa-whatsapp";
                icon.style.color = "#25D366";
                numSpan.innerText = d.whatsapp || d.contact || "86996-40061";
            } else {
                icon.className = "fas fa-phone-alt";
                icon.style.color = "white";
                numSpan.innerText = d.contact || "86996-40061";
            }
            isW = !isW;
        });
    }, 10000);


    function moveWatermark() {
        const wm = document.getElementById('watermark');
        const maxX = window.innerWidth - wm.offsetWidth - 50;
        const maxY = window.innerHeight - 150;
        wm.style.left = Math.floor(Math.random() * maxX) + 'px';
        wm.style.top = (Math.floor(Math.random() * (maxY - 120)) + 120) + 'px';
    }
    setInterval(moveWatermark, 7000);

    function triggerGoal() {
        const overlay = document.getElementById('goal-overlay');
        overlay.style.display = 'flex';
        setTimeout(() => { overlay.style.display = 'none'; }, 3000);
    }

    function updateClock() {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }
    setInterval(updateClock, 1000);
    updateClock();
    window.onload = moveWatermark;
</script>
</body>
</html>
