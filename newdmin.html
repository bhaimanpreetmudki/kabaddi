<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Admin - Score & Ticker</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0d0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #161b22; width: 100%; max-width: 500px; border-radius: 12px; border: 1px solid #30363d; overflow: hidden; margin-bottom: 12px; box-sizing: border-box; }
        .header { background: #238636; color: white; padding: 8px; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .teams-container { display: flex; padding: 10px; gap: 5px; background: #0d1117; align-items: center; }
        .team-box { flex: 2; text-align: center; padding: 10px; border-radius: 8px; background: #161b22; border-top: 4px solid #fff; }
        .mid-controls { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .score-val { font-size: 38px; font-weight: 900; color: #2ecc71; margin: 2px 0; }
        .btn-pm { border: none; color: white; padding: 5px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer; flex: 1; margin: 0 2px; }
        .card-btn { padding: 8px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 9px; flex: 1; width: 100%; }
        .std-input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; }
        .std-textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; min-height: 45px; resize: none; overflow: hidden; }
        .label-text, .label-title { font-size: 10px; color: #8b949e; display: block; margin-top: 5px; text-align: left; text-transform: uppercase; font-weight: bold; }
        .content { padding: 15px; }
        .btn-update { background: #1a73e8; color: white; padding: 12px; border-radius: 6px; border:none; cursor:pointer; width:100%; font-weight:bold; margin-bottom: 10px;}
        .btn-ticker { background: #ff5722; color: white; margin-bottom: 15px; height: 50px; font-size: 16px; border-radius: 6px; border:none; width:100%; font-weight:bold; cursor:pointer; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .flex-row { display: flex; gap: 5px; margin-top: 8px; }
        #penaltyControlSection { display: none; background: #1c2128; padding: 15px; border-top: 3px solid #f39c12; }
        .card-record-box { margin-top: 8px; padding: 5px; background: #0d1117; border-radius: 4px; font-size: 10px; min-height: 25px; border: 1px dashed #444; }
        .card-tag { display: inline-block; padding: 2px 5px; border-radius: 3px; margin: 2px; font-weight: bold; font-size: 9px; }
    </style>
</head>
<body>

<div id="main-content" style="width: 100%; max-width: 500px;">
    
    <div class="card">
        <div class="header"><i class="fas fa-futbol"></i> Scoreboard & Quick Actions</div>
        <div class="teams-container">
            <div class="team-box" id="boxA">
                <input type="color" id="colorA" value="#ffffff" oninput="updateMatchDB()" style="width:100%; height:18px; border:none; cursor:pointer;">
                <input type="text" id="nameA" class="std-input" placeholder="Home Team" oninput="updateMatchDB()">
                <div class="score-val" id="dispA">0</div>
                <div style="display:flex; margin-bottom:5px;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreA', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreA', 1)">+</button>
                </div>
                <input type="text" id="playerA" class="std-input" placeholder="No" style="border-color:#f1c40f;">
                <div class="grid-2">
                    <button class="card-btn" style="background:#f1c40f; color:#000;" onclick="handleCard('A', 'Yellow')">YC</button>
                    <button class="card-btn" style="background:#e74c3c;" onclick="handleCard('A', 'Red')">RC</button>
                </div>
                <div id="cardRecordA" class="card-record-box">Record: -</div>
            </div>

            <div class="mid-controls">
                <button id="visBtn" class="card-btn" style="background:#238636;" onclick="toggleVis('scoreVisible')">SHOW</button>
                <button class="card-btn" style="background:#333;" onclick="resetOnlyScore()">RESET</button>
                <div style="font-weight:bold; color:#444;">VS</div>
            </div>

            <div class="team-box" id="boxB">
                <input type="color" id="colorB" value="#ffffff" oninput="updateMatchDB()" style="width:100%; height:18px; border:none; cursor:pointer;">
                <input type="text" id="nameB" class="std-input" placeholder="Away Team" oninput="updateMatchDB()">
                <div class="score-val" id="dispB">0</div>
                <div style="display:flex; margin-bottom:5px;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreB', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreB', 1)">+</button>
                </div>
                <input type="text" id="playerB" class="std-input" placeholder="No" style="border-color:#f1c40f;">
                <div class="grid-2">
                    <button class="card-btn" style="background:#f1c40f; color:#000;" onclick="handleCard('B', 'Yellow')">YC</button>
                    <button class="card-btn" style="background:#e74c3c;" onclick="handleCard('B', 'Red')">RC</button>
                </div>
                <div id="cardRecordB" class="card-record-box">Record: -</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header"><i class="fas fa-info-circle"></i> Match Information</div>
        <div style="padding:12px; background:#0d1117;">
            <div class="grid-2">
                <div style="text-align:center; border-right: 1px solid #333; padding-right:10px;">
                    <div class="flex-row" style="margin-top: 0; margin-bottom: 10px;">
                        <button id="mainTimerBtn" class="card-btn" style="background:#238636; height: 40px;" onclick="toggleTimer()">START</button>
                        <button class="card-btn" style="background:#333; height: 40px; flex: 0.6;" onclick="resetTimer()">00</button>
                    </div>
                    <div id="timerShow" style="font-size:36px; color:#f1c40f; font-family:monospace; background: #161b22; border-radius: 4px; border: 1px solid #30363d; padding: 5px; margin-bottom: 8px;">00:00</div>
                    <span class="label-text" style="color:#8b949e; font-size: 9px;">Total Match Time</span>
                    <input type="text" id="matchTotalTime" class="std-input" placeholder="e.g. 15:00" oninput="updateMatchDB()" style="text-align: center; margin-top: 4px; border-color: #444;">
                </div>
                <div style="padding-left:5px;">
                    <span class="label-text" style="color:#2ecc71;">Match Round</span>
                    <input type="text" id="matchRound" class="std-input" placeholder="Final" oninput="updateMatchDB()">
                    <span class="label-text" style="color:#f1c40f;">Match Half</span>
                    <input type="text" id="roundInp" class="std-input" placeholder="1st Half" oninput="updateMatchDB()">
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header" style="background:#f39c12; color:#000;">Penalty Shootout</div>
        <div style="padding:10px; display:flex; gap:5px;">
            <button id="pVisBtn" class="card-btn" style="background:#f39c12; color:#000;" onclick="togglePenaltyVis()">Show Penalty</button>
            <button class="card-btn" style="background:#333;" onclick="resetPenaltyOnly()">Reset Penalty</button>
        </div>
        <div id="penaltyControlSection">
            <div class="grid-2">
                <div>
                    <input type="text" id="pA" class="std-input" readonly style="text-align:center;">
                    <div class="flex-row">
                        <button class="card-btn" style="background:#2ecc71;" onclick="addPenalty('pA', '✅')">Goal</button>
                        <button class="card-btn" style="background:#555;" onclick="addPenalty('pA', '❌')">Miss</button>
                    </div>
                </div>
                <div>
                    <input type="text" id="pB" class="std-input" readonly style="text-align:center;">
                    <div class="flex-row">
                        <button class="card-btn" style="background:#2ecc71;" onclick="addPenalty('pB', '✅')">Goal</button>
                        <button class="card-btn" style="background:#555;" onclick="addPenalty('pB', '❌')">Miss</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header" style="background:#444;">Ticker Info & Next Program</div>
        <div class="content">
            <button id="tickerToggleBtn" class="btn-ticker" onclick="confirmTickerAction('vis')">Ticker: ON/OFF</button>
            <span class="label-title">Tournament & Prize</span>
            <input type="text" id="tourName" class="std-input" placeholder="Tournament Name">
            <input type="text" id="prizeList" class="std-input" placeholder="Prizes">
            <span class="label-title">Contact Information</span>
            <input type="text" id="contactInfo" class="std-input" placeholder="Call Number">
            <input type="text" id="whatsappNumber" class="std-input" placeholder="WhatsApp Number">
            <span class="label-title" style="color:#2ecc71;">Participating Teams</span>
            <textarea id="teamsList" class="std-textarea" placeholder="Enter Team names here..." oninput="autoExpand(this)"></textarea>
            <span class="label-title" style="color:#e67e22;">Next Program</span>
            <input type="text" id="nextProg" class="std-input" placeholder="ਅਗਲਾ ਪ੍ਰੋਗਰਾਮ...">
            <button class="btn-update" style="background: #238636;" onclick="confirmTickerAction('info')">Update All Ticker Info</button>
            <div class="label-title">Watermark</div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="wmText" class="std-input" placeholder="Brand Name" style="margin:0;">
                <button class="btn-update" style="width:80px; margin:0;" onclick="confirmTickerAction('wm')">Set</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="padding:10px;">
            <button class="card-btn" style="background:#e74c3c; padding:12px; font-size:12px;" onclick="fullReset()">FULL RESET (ALL DATA & CARDS)</button>
        </div>
    </div>
</div>

<script>
    // --- 1. Firebase Config & Initialization ---
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    const matchRef = db.ref("matchData");
    const tickerRef = db.ref("tickerData");

    let seconds = 0;
    let timerInterval = null;

    // --- 2. Realtime Sync: Firebase ਤੋਂ ਡਾਟਾ ਲੈ ਕੇ Admin ਵਿੱਚ ਦਿਖਾਉਣਾ ---
    matchRef.on("value", (snap) => {
        const d = snap.val() || {};
        // ਸਕੋਰ ਅਤੇ ਨਾਮ
        document.getElementById('dispA').innerText = d.scoreA || 0;
        document.getElementById('dispB').innerText = d.scoreB || 0;
        document.getElementById('nameA').value = d.nameA || "";
        document.getElementById('nameB').value = d.nameB || "";
        document.getElementById('colorA').value = d.colorA || "#cc0000";
        document.getElementById('colorB').value = d.colorB || "#ffffff";
        
        // ਮੈਚ ਡੀਟੇਲ
        document.getElementById('matchRound').value = d.matchRound || "";
        document.getElementById('roundInp').value = d.round || "";
        
      // *** ਇਹ ਹਿੱਸਾ Penalty Box ਨੂੰ SHOW/HIDE ਕਰੇਗਾ ***
    const pSec = document.getElementById('penaltyControlSection');
    const pBtn = document.getElementById('pVisBtn');
    
    if (d.penaltyVisible) {
        pSec.style.display = "block";  // ਬਾਕਸ ਦਿਖਾਓ
        pBtn.innerText = "Hide Penalty";
        pBtn.style.background = "#da3633"; // ਰੰਗ ਲਾਲ (Hide ਲਈ)
    } else {
        pSec.style.display = "none";   // ਬਾਕਸ ਛੁਪਾਓ
        pBtn.innerText = "Show Penalty";
        pBtn.style.background = "#f39c12"; // ਰੰਗ ਪੀਲਾ (Show ਲਈ)
    }

        // ਟਾਈਮਰ ਸਿੰਕ
        if (d.timerRunning) {
            document.getElementById('mainTimerBtn').innerText = "STOP";
            document.getElementById('mainTimerBtn').style.background = "#da3633";
            startLocalTimer(d.startTime);
        } else {
            document.getElementById('mainTimerBtn').innerText = "START";
            document.getElementById('mainTimerBtn').style.background = "#238636";
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timerShow').innerText = d.matchTime || "00:00";
            // ਸੇਵ ਕੀਤੇ ਸੈਕਿੰਡ ਅਪਡੇਟ ਕਰੋ ਤਾਂ ਜੋ ਰੀਸਟਾਰਟ ਉਥੋਂ ਹੀ ਹੋਵੇ
            let parts = (d.matchTime || "00:00").split(':');
            seconds = (parseInt(parts[0]) * 60) + parseInt(parts[1]);
        }
    });

    // Ticker Data Sync
    tickerRef.on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('tourName').value = d.tournamentName || "";
        document.getElementById('prizeList').value = d.prizes || "";
        document.getElementById('contactInfo').value = d.contact || "";
        document.getElementById('whatsappNumber').value = d.whatsapp || "";
        document.getElementById('teamsList').value = d.participatingTeams || "";
        document.getElementById('nextProg').value = d.nextProgram || "";
        document.getElementById('wmText').value = d.watermarkText || "";
        
        const tBtn = document.getElementById('tickerToggleBtn');
        if (d.tickerVis === false) {
            tBtn.innerText = "Ticker: OFF";
            tBtn.style.background = "#da3633";
        } else {
            tBtn.innerText = "Ticker: ON";
            tBtn.style.background = "#238636";
        }
    });

    // --- 3. Functions: Score & Visibility ---
    function changeScore(team, val) {
        matchRef.child(team).transaction(c => (c || 0) + val);
    }

    function toggleVis(field) {
        matchRef.once("value", snap => {
            let curr = snap.val()[field];
            matchRef.update({ [field]: (curr === false) });
        });
    }

    function updateMatchDB() {
        matchRef.update({
            nameA: document.getElementById('nameA').value,
            nameB: document.getElementById('nameB').value,
            colorA: document.getElementById('colorA').value,
            colorB: document.getElementById('colorB').value,
            matchRound: document.getElementById('matchRound').value,
            round: document.getElementById('roundInp').value
        });
    }

    // --- 4. Cards (Yellow/Red) ---
    function handleCard(team, type) {
        let playerNo = document.getElementById('player' + team).value;
        if (!playerNo) { alert("Please enter player number!"); return; }
        
        let cardKey = "card" + team; // cardA or cardB
        matchRef.update({ [cardKey]: type.toLowerCase() });

        let recordBox = document.getElementById('cardRecord' + team);
        recordBox.innerHTML += `<span class="card-tag" style="background:${type==='Yellow'?'#f1c40f':'#e74c3c'}; color:${type==='Yellow'?'#000':'#fff'}">${playerNo} ${type[0]}</span>`;
        
        // 7 ਸੈਕਿੰਡ ਬਾਅਦ ਓਵਰਲੇਅ ਤੋਂ ਹਟਾ ਦਿਓ
        setTimeout(() => { matchRef.update({ [cardKey]: "" }); }, 7000);
    }

    // --- 5. Timer Logic ---
    function toggleTimer() {
        matchRef.once("value", snap => {
            const d = snap.val() || {};
            if (d.timerRunning) {
                matchRef.update({ timerRunning: false });
            } else {
                let startTime = Date.now() - (seconds * 1000);
                matchRef.update({ timerRunning: true, startTime: startTime });
            }
        });
    }

    function startLocalTimer(startTime) {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds = Math.floor((Date.now() - startTime) / 1000);
            let m = Math.floor(seconds / 60), s = seconds % 60;
            let timeStr = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
            document.getElementById('timerShow').innerText = timeStr;
            matchRef.child('matchTime').set(timeStr);
        }, 1000);
    }

    function resetTimer() {
        seconds = 0;
        matchRef.update({ timerRunning: false, startTime: null, matchTime: "00:00" });
    }

    // --- 6. Penalty Logic ---
    function addPenalty(team, icon) {
        matchRef.child(team).once("value", snap => {
            let current = snap.val() || "";
            matchRef.update({ [team]: current + icon });
        });
    }
    
    function togglePenaltyVis() {
        matchRef.once("value", snap => {
            let v = snap.val().penaltyVisible;
            matchRef.update({ penaltyVisible: !v });
        });
    }

    // --- 7. Ticker Actions ---
    function confirmTickerAction(type) {
        if (type === 'info') {
            tickerRef.update({
                tournamentName: document.getElementById('tourName').value,
                prizes: document.getElementById('prizeList').value,
                contact: document.getElementById('contactInfo').value,
                whatsapp: document.getElementById('whatsappNumber').value,
                participatingTeams: document.getElementById('teamsList').value,
                nextProgram: document.getElementById('nextProg').value
            }).then(() => alert("Data Updated!"));
        } else if (type === 'wm') {
            tickerRef.update({ watermarkText: document.getElementById('wmText').value });
        } else if (type === 'vis') {
            tickerRef.once("value", snap => {
                let v = snap.val().tickerVis;
                tickerRef.update({ tickerVis: (v === false) });
            });
        }
    }

   function resetOnlyScore() {
    // 1. Firebase ਵਿੱਚ ਸਕੋਰ ਅਤੇ ਕਾਰਡਸ ਨੂੰ ਜ਼ੀਰੋ/ਖਾਲੀ ਕਰੋ
    matchRef.update({ 
        scoreA: 0, 
        scoreB: 0, 
        cardA: "", 
        cardB: "" 
    });

    // 2. ਐਡਮਿਨ ਪੈਨਲ ਵਿੱਚ ਜੋ ਕਾਰਡਸ ਦੀ ਲਿਸਟ (YC/RC) ਦਿਖ ਰਹੀ ਹੈ, ਉਸਨੂੰ ਵੀ ਸਾਫ਼ ਕਰੋ
    document.getElementById('cardRecordA').innerHTML = "Record: -";
    document.getElementById('cardRecordB').innerHTML = "Record: -";
    
    // 3. ਪਲੇਅਰ ਨੰਬਰ ਵਾਲੇ ਇਨਪੁਟ ਵੀ ਖਾਲੀ ਕਰ ਦਿਓ (Optional)
    document.getElementById('playerA').value = "";
    document.getElementById('playerB').value = "";
}
    
    function fullReset() {
        if (confirm("Reset everything?")) {
            matchRef.set({
                scoreA: 0, scoreB: 0, nameA: "TEAM A", nameB: "TEAM B",
                colorA: "#cc0000", colorB: "#ffffff",
                matchTime: "00:00", timerRunning: false,
                pA: "", pB: "", penaltyVisible: false,
                scoreVisible: true, cardA: "", cardB: ""
            });
            document.querySelectorAll('.card-record-box').forEach(b => b.innerHTML = "Record: -");
        }
    }
</script>
