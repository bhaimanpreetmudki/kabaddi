<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Admin - Score & Ticker</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0d0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #161b22; width: 100%; max-width: 500px; border-radius: 12px; border: 1px solid #30363d; overflow: hidden; margin-bottom: 12px; box-sizing: border-box; }
        .header { background: #238636; color: white; padding: 8px; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        
        /* 50-50 Layout Fix */
        .teams-container { display: flex; padding: 10px; gap: 8px; background: #0d1117; align-items: stretch; }
        .team-box { flex: 1; min-width: 0; text-align: center; padding: 10px; border-radius: 8px; background: #161b22; border-top: 4px solid #fff; }
        .mid-controls { flex: 0.3; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; }
        
        /* Score & Divider */
        .score-wrapper { display: flex; justify-content: center; align-items: center; font-size: 38px; font-weight: 900; color: #2ecc71; margin: 5px 0; }
        .score-divider { color: #666; margin-right: 5px; font-weight: 300; }
        .score-val { font-size: 38px; font-weight: 900; color: #2ecc71; }

        /* Name Scrolling */
        .name-container { width: 100%; overflow: hidden; white-space: nowrap; height: 25px; margin-bottom: 5px; }
        .scroll-text { display: inline-block; font-size: 14px; font-weight: bold; color: #fff; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .btn-pm { border: none; color: white; padding: 5px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer; flex: 1; margin: 0 2px; }
        .card-btn { padding: 8px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 9px; flex: 1; width: 100%; }
        .std-input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; }
        .std-textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; min-height: 45px; resize: none; overflow: hidden; }
        .label-text, .label-title { font-size: 10px; color: #8b949e; display: block; margin-top: 5px; text-align: left; text-transform: uppercase; font-weight: bold; }
        .btn-update { background: #1a73e8; color: white; padding: 12px; border-radius: 6px; border:none; cursor:pointer; width:100%; font-weight:bold; margin-bottom: 10px;}
        .btn-ticker { background: #ff5722; color: white; margin-bottom: 15px; height: 50px; font-size: 16px; border-radius: 6px; border:none; width:100%; font-weight:bold; cursor:pointer; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .flex-row { display: flex; gap: 5px; margin-top: 8px; }
        #penaltyControlSection { display: none; background: #1c2128; padding: 15px; border-top: 3px solid #f39c12; }
        .card-record-box { margin-top: 8px; padding: 5px; background: #0d1117; border-radius: 4px; font-size: 10px; min-height: 25px; border: 1px dashed #444; }
        .card-tag { display: inline-block; padding: 2px 5px; border-radius: 3px; margin: 2px; font-weight: bold; font-size: 9px; }
    </style>
</head>
<body>

<div id="main-content" style="width: 100%; max-width: 500px;">
    <div class="card">
        <div class="header"><i class="fas fa-futbol"></i> Scoreboard & Quick Actions</div>
        <div class="teams-container">
            <div class="team-box" id="boxA">
                <input type="color" id="colorA" value="#ffffff" oninput="updateMatchDB()" style="width:100%; height:12px; border:none; cursor:pointer; margin-bottom:5px;">
                <div class="name-container"><div id="scrollA" class="scroll-text">HOME TEAM</div></div>
                <input type="text" id="nameA" class="std-input" placeholder="Home Team" oninput="checkNameScroll('A')">
                <div class="score-wrapper"><span class="score-divider">|</span><div id="dispA" class="score-val">0</div></div>
                <div style="display:flex; gap:2px; margin-bottom:5px;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreA', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreA', 1)">+</button>
                </div>
                <input type="text" id="playerA" class="std-input" placeholder="No" style="border-color:#f1c40f;">
                <div class="grid-2">
                    <button class="card-btn" style="background:#f1c40f; color:#000;" onclick="handleCard('A', 'Yellow')">YC</button>
                    <button class="card-btn" style="background:#e74c3c;" onclick="handleCard('A', 'Red')">RC</button>
                </div>
                <div id="cardRecordA" class="card-record-box">Record: -</div>
            </div>

            <div class="mid-controls">
                <button id="visBtn" class="card-btn" style="background:#238636;" onclick="toggleVis('scoreVisible')">SHOW</button>
                <button class="card-btn" style="background:#333;" onclick="resetOnlyScore()">RESET</button>
                <div style="font-weight:bold; color:#444; font-size: 12px;">VS</div>
            </div>

            <div class="team-box" id="boxB">
                <input type="color" id="colorB" value="#ffffff" oninput="updateMatchDB()" style="width:100%; height:12px; border:none; cursor:pointer; margin-bottom:5px;">
                <div class="name-container"><div id="scrollB" class="scroll-text">AWAY TEAM</div></div>
                <input type="text" id="nameB" class="std-input" placeholder="Away Team" oninput="checkNameScroll('B')">
                <div class="score-wrapper"><span class="score-divider">|</span><div id="dispB" class="score-val">0</div></div>
                <div style="display:flex; gap:2px; margin-bottom:5px;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreB', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreB', 1)">+</button>
                </div>
                <input type="text" id="playerB" class="std-input" placeholder="No" style="border-color:#f1c40f;">
                <div class="grid-2">
                    <button class="card-btn" style="background:#f1c40f; color:#000;" onclick="handleCard('B', 'Yellow')">YC</button>
                    <button class="card-btn" style="background:#e74c3c;" onclick="handleCard('B', 'Red')">RC</button>
                </div>
                <div id="cardRecordB" class="card-record-box">Record: -</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header"><i class="fas fa-info-circle"></i> Match Information</div>
        <div style="padding:12px; background:#0d1117;">
            <div class="grid-2">
                <div style="text-align:center; border-right: 1px solid #333; padding-right:10px;">
                    <div class="flex-row" style="margin-top: 0; margin-bottom: 10px;">
                        <button id="mainTimerBtn" class="card-btn" style="background:#238636; height: 40px;" onclick="toggleTimer()">START</button>
                        <button class="card-btn" style="background:#333; height: 40px; flex: 0.6;" onclick="resetTimer()">00</button>
                    </div>
                    <div id="timerShow" style="font-size:36px; color:#f1c40f; font-family:monospace; background: #161b22; border-radius: 4px; border: 1px solid #30363d; padding: 5px; margin-bottom: 8px;">00:00</div>
                    <input type="text" id="matchTotalTime" class="std-input" placeholder="e.g. 15:00" oninput="updateMatchDB()" style="text-align: center; margin-top: 4px; border-color: #444;">
                </div>
                <div style="padding-left:5px;">
                    <span class="label-text" style="color:#2ecc71;">Match Round</span>
                    <input type="text" id="matchRound" class="std-input" placeholder="Final" oninput="updateMatchDB()">
                    <span class="label-text" style="color:#f1c40f;">Match Half</span>
                    <input type="text" id="roundInp" class="std-input" placeholder="1st Half" oninput="updateMatchDB()">
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header" style="background:#444;">Ticker Info</div>
        <div style="padding:15px;">
            <button id="tickerToggleBtn" class="btn-ticker" onclick="confirmTickerAction('vis')">Ticker: ON/OFF</button>
            <input type="text" id="tourName" class="std-input" placeholder="Tournament Name">
            <textarea id="teamsList" class="std-textarea" placeholder="Enter Team names here..."></textarea>
            <button class="btn-update" style="background: #238636;" onclick="confirmTickerAction('info')">Update Ticker</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    const matchRef = db.ref("matchData");
    const tickerRef = db.ref("tickerData");

    let seconds = 0;
    let timerInterval = null;

    matchRef.on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('dispA').innerText = d.scoreA || 0;
        document.getElementById('dispB').innerText = d.scoreB || 0;
        document.getElementById('nameA').value = d.nameA || "";
        document.getElementById('nameB').value = d.nameB || "";
        document.getElementById('colorA').value = d.colorA || "#ffffff";
        document.getElementById('colorB').value = d.colorB || "#ffffff";
        document.getElementById('matchRound').value = d.matchRound || "";
        document.getElementById('roundInp').value = d.round || "";
        
        // Timer Sync
        if (d.timerRunning) {
            document.getElementById('mainTimerBtn').innerText = "STOP";
            document.getElementById('mainTimerBtn').style.background = "#da3633";
            startLocalTimer(d.startTime);
        } else {
            document.getElementById('mainTimerBtn').innerText = "START";
            document.getElementById('mainTimerBtn').style.background = "#238636";
            clearInterval(timerInterval);
            document.getElementById('timerShow').innerText = d.matchTime || "00:00";
            let parts = (d.matchTime || "00:00").split(':');
            seconds = (parseInt(parts[0]) * 60) + parseInt(parts[1]);
        }
    });

    function checkNameScroll(team) {
        let nameVal = document.getElementById('name' + team).value;
        let scrollEl = document.getElementById('scroll' + team);
        scrollEl.innerText = nameVal.toUpperCase() || "TEAM " + team;
        scrollEl.style.animation = (nameVal.length > 12) ? "marquee 5s linear infinite" : "none";
        updateMatchDB();
    }

    function changeScore(team, val) { matchRef.child(team).transaction(c => (c || 0) + val); }
    function toggleVis(field) { matchRef.once("value", snap => { matchRef.update({ [field]: !snap.val()[field] }); }); }
    
    function updateMatchDB() {
        matchRef.update({
            nameA: document.getElementById('nameA').value,
            nameB: document.getElementById('nameB').value,
            colorA: document.getElementById('colorA').value,
            colorB: document.getElementById('colorB').value,
            matchRound: document.getElementById('matchRound').value,
            round: document.getElementById('roundInp').value
        });
    }

    function handleCard(team, type) {
        let pNo = document.getElementById('player' + team).value;
        if (!pNo) return alert("Enter No!");
        matchRef.update({ ["card" + team]: type.toLowerCase() });
        document.getElementById('cardRecord' + team).innerHTML += `<span class="card-tag" style="background:${type==='Yellow'?'#f1c40f':'#e74c3c'}">${pNo} ${type[0]}</span>`;
        setTimeout(() => matchRef.update({ ["card" + team]: "" }), 7000);
    }

    function toggleTimer() {
        matchRef.once("value", snap => {
            let d = snap.val();
            if (d.timerRunning) { matchRef.update({ timerRunning: false }); } 
            else { matchRef.update({ timerRunning: true, startTime: Date.now() - (seconds * 1000) }); }
        });
    }

    function startLocalTimer(startTime) {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds = Math.floor((Date.now() - startTime) / 1000);
            let m = Math.floor(seconds / 60), s = seconds % 60;
            let str = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
            document.getElementById('timerShow').innerText = str;
            matchRef.child('matchTime').set(str);
        }, 1000);
    }

    function resetTimer() { seconds = 0; matchRef.update({ timerRunning: false, matchTime: "00:00" }); }
    function resetOnlyScore() { 
        matchRef.update({ scoreA: 0, scoreB: 0, cardA: "", cardB: "" }); 
        document.querySelectorAll('.card-record-box').forEach(b => b.innerHTML = "Record: -");
    }
</script>
</body>
</html>
