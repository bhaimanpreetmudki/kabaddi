<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sukhdeep TV Admin - Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0d0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #161b22; width: 100%; max-width: 500px; border-radius: 12px; border: 1px solid #30363d; overflow: hidden; margin-bottom: 12px; box-sizing: border-box; }
        .header { background: #cc0000; color: white; padding: 8px; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .teams-container { display: flex; padding: 10px; gap: 5px; background: #0d1117; align-items: center; }
        .team-box { flex: 2; text-align: center; padding: 10px; border-radius: 8px; background: #161b22; border-top: 4px solid #fff; }
        .mid-controls { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .score-val { font-size: 38px; font-weight: 900; color: #2ecc71; margin: 2px 0; }
        .btn-pm { border: none; color: white; padding: 8px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer; flex: 1; margin: 0 2px; }
        .card-btn { padding: 8px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 10px; flex: 1; width: 100%; }
        .std-input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; }
        .content { padding: 15px; }
        .btn-update { background: #1a73e8; color: white; padding: 12px; border-radius: 6px; border:none; cursor:pointer; width:100%; font-weight:bold; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .flex-row { display: flex; gap: 5px; margin-top: 8px; }
        #penaltyControlSection { display: none; background: #1c2128; padding: 15px; border-top: 3px solid #f39c12; }
    </style>
</head>
<body>

<div id="main-content" style="width: 100%; max-width: 500px;">
    
    <!-- 1. SCOREBOARD -->
    <div class="card">
        <div class="header">Scoreboard Control</div>
        <div class="teams-container">
            <div class="team-box" id="boxA">
                <input type="color" id="colorA" oninput="updateMatchDB()" style="width:100%; height:18px;">
                <input type="text" id="nameA" class="std-input" placeholder="Team A" oninput="updateMatchDB()">
                <div class="score-val" id="dispA">0</div>
                <div style="display:flex;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreA', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreA', 1)">+</button>
                </div>
            </div>

            <div class="mid-controls">
                <button id="visBtn" class="card-btn" style="background:#238636;" onclick="toggleVis('scoreVisible')">SHOW</button>
                <button class="card-btn" style="background:#333;" onclick="resetOnlyScore()">RESET</button>
            </div>

            <div class="team-box" id="boxB">
                <input type="color" id="colorB" oninput="updateMatchDB()" style="width:100%; height:18px;">
                <input type="text" id="nameB" class="std-input" placeholder="Team B" oninput="updateMatchDB()">
                <div class="score-val" id="dispB">0</div>
                <div style="display:flex;">
                    <button class="btn-pm" style="background:#da3633;" onclick="changeScore('scoreB', -1)">-</button>
                    <button class="btn-pm" style="background:#238636;" onclick="changeScore('scoreB', 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. NEW SERVER TIMER CONTROL -->
    <div class="card">
        <div class="header">Persistent Match Timer</div>
        <div style="padding:15px; background:#0d1117; text-align:center;">
            <div id="timerShow" style="font-size:48px; color:#f1c40f; font-family:monospace; margin-bottom:10px;">00:00</div>
            <div class="flex-row">
                <button class="card-btn" style="background:#238636; font-size:14px;" onclick="startMatchTimer()">START</button>
                <button class="card-btn" style="background:#f39c12; font-size:14px;" onclick="pauseMatchTimer()">PAUSE</button>
                <button class="card-btn" style="background:#333; font-size:14px;" onclick="resetMatchTimer()">RESET</button>
            </div>
            <div class="grid-2" style="margin-top:10px;">
                <input type="text" id="matchRound" class="std-input" placeholder="Round Name" oninput="updateMatchDB()">
                <input type="text" id="roundInp" class="std-input" placeholder="1st Half" oninput="updateMatchDB()">
            </div>
        </div>
    </div>

    <!-- 3. PENALTY SHOOTOUT (UNLIMITED) -->
    <div class="card">
        <div class="header" style="background:#f39c12; color:black;">Penalty (No Limit)</div>
        <div style="padding:10px; display:flex; gap:5px;">
            <button id="pVisBtn" class="card-btn" style="background:#f39c12; color:black;" onclick="togglePenaltyVis()">Show Penalty</button>
            <button class="card-btn" style="background:#333;" onclick="resetPenaltyOnly()">Clear All</button>
        </div>
        <div id="penaltyControlSection">
            <div class="grid-2">
                <div>
                    <input type="text" id="pA" class="std-input" readonly style="text-align:center; font-size:10px;">
                    <div class="flex-row">
                        <button class="card-btn" style="background:#2ecc71;" onclick="addPenalty('pA', '✅')">Goal</button>
                        <button class="card-btn" style="background:#555;" onclick="addPenalty('pA', '❌')">Miss</button>
                    </div>
                </div>
                <div>
                    <input type="text" id="pB" class="std-input" readonly style="text-align:center; font-size:10px;">
                    <div class="flex-row">
                        <button class="card-btn" style="background:#2ecc71;" onclick="addPenalty('pB', '✅')">Goal</button>
                        <button class="card-btn" style="background:#555;" onclick="addPenalty('pB', '❌')">Miss</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const matchRef = firebase.database().ref("matchData");

    let curA = 0, curB = 0, sVis = true, pVis = false;
    let serverStartTime = 0, serverElapsed = 0, serverIsPaused = true;

    // --- ਫਾਇਰਬੇਸ ਤੋਂ ਡਾਟਾ ਸਿੰਕ ਕਰਨਾ ---
    matchRef.on("value", (snap) => {
        const data = snap.val() || {};
        curA = data.scoreA || 0; curB = data.scoreB || 0;
        sVis = !!data.scoreVisible; pVis = !!data.penaltyVisible;
        
        // ਟਾਈਮਰ ਡਾਟਾ
        serverStartTime = data.startTime || 0;
        serverElapsed = data.elapsedTime || 0;
        serverIsPaused = (data.isPaused !== false);

        document.getElementById('dispA').innerText = curA;
        document.getElementById('dispB').innerText = curB;
        document.getElementById('pA').value = data.penaltyA || "";
        document.getElementById('pB').value = data.penaltyB || "";
        document.getElementById('nameA').value = data.nameA || "";
        document.getElementById('nameB').value = data.nameB || "";
        document.getElementById('colorA').value = data.colorA || "#ffffff";
        document.getElementById('colorB').value = data.colorB || "#ffffff";
        document.getElementById('matchRound').value = data.matchRound || "";
        document.getElementById('roundInp').value = data.round || "";
        
        document.getElementById('visBtn').innerText = sVis ? "HIDE" : "SHOW";
        document.getElementById('visBtn').style.background = sVis ? "#da3633" : "#238636";
        document.getElementById('penaltyControlSection').style.display = pVis ? "block" : "none";
        document.getElementById('pVisBtn').innerText = pVis ? "Hide Penalty" : "Show Penalty";
    });

    // --- ਨਵਾਂ ਟਾਈਮਰ ਲੋਜਿਕ (Persistent) ---
    function startMatchTimer() {
        if (!serverIsPaused) return; // ਪਹਿਲਾਂ ਹੀ ਚੱਲ ਰਿਹਾ ਹੈ
        matchRef.update({
            startTime: Date.now(),
            isPaused: false
        });
    }

    function pauseMatchTimer() {
        if (serverIsPaused) return;
        const now = Date.now();
        const sessionSeconds = Math.floor((now - serverStartTime) / 1000);
        const totalElapsed = serverElapsed + sessionSeconds;
        matchRef.update({
            isPaused: true,
            elapsedTime: totalElapsed,
            startTime: 0
        });
    }

    function resetMatchTimer() {
        if(confirm("Reset Timer?")) {
            matchRef.update({
                startTime: 0,
                elapsedTime: 0,
                isPaused: true
            });
        }
    }

    // ਐਡਮਿਨ ਪੈਨਲ ਦੀ ਸਕਰੀਨ 'ਤੇ ਟਾਈਮਰ ਦਿਖਾਉਣ ਲਈ
    setInterval(() => {
        let displaySecs = 0;
        if (!serverIsPaused && serverStartTime > 0) {
            displaySecs = Math.floor((Date.now() - serverStartTime) / 1000) + serverElapsed;
        } else {
            displaySecs = serverElapsed;
        }
        const m = Math.floor(displaySecs / 60).toString().padStart(2, '0');
        const s = (displaySecs % 60).toString().padStart(2, '0');
        document.getElementById('timerShow').innerText = `${m}:${s}`;
    }, 1000);

    // --- ਪੈਨਲਟੀ (ਬਿਨਾਂ ਲਿਮਿਟ) ---
    function addPenalty(id, icon) {
        let inp = document.getElementById(id);
        inp.value = inp.value + icon;
        updateMatchDB();
    }

    function updateMatchDB() {
        matchRef.update({
            nameA: document.getElementById('nameA').value,
            nameB: document.getElementById('nameB').value,
            colorA: document.getElementById('colorA').value,
            colorB: document.getElementById('colorB').value,
            penaltyA: document.getElementById('pA').value,
            penaltyB: document.getElementById('pB').value,
            matchRound: document.getElementById('matchRound').value,
            round: document.getElementById('roundInp').value
        });
    }

    function changeScore(team, val) {
        let current = (team === 'scoreA' ? curA : curB);
        matchRef.update({ [team]: Math.max(0, current + val) });
    }

    function toggleVis(field) { matchRef.child(field).set(!sVis); }
    function togglePenaltyVis() { matchRef.child('penaltyVisible').set(!pVis); }
    function resetPenaltyOnly() { if(confirm("Clear Penalties?")) matchRef.update({ penaltyA: "", penaltyB: "" }); }
    function resetOnlyScore() { if(confirm("Reset Score?")) matchRef.update({ scoreA: 0, scoreB: 0 }); }
</script>
</body>
</html>
