<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Sukhdeep TV - Final Master Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --arrow-width: 20px;
            --arrow-height: 50px;
            --label-padding: 25px;
            --main-red: #cc0000;
            --pure-white: #ffffff;
            --pure-black: #000000;
            --container-width: 630px; /* ਚੌੜਾਈ ਥੋੜੀ ਵਧਾਈ ਹੈ */
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: transparent; }

        /* --- Scoreboard Wrapper --- */
        #scoreboard-wrapper { position: absolute; top: 25px; left: 20px; display: flex; flex-direction: column; gap: 2px; z-index: 100; }
        #scoreboard-main-row { display: flex; align-items: flex-start; }
        
        #scoreboard-container { 
            display: flex; 
            width: var(--container-width); 
            border: 3px solid var(--pure-white); 
            border-radius: 6px; 
            overflow: hidden; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); 
            background: var(--pure-black); 
        }

        /* Jersey Box ਵੱਡਾ ਕੀਤਾ ਗਿਆ ਹੈ */
        .jersey-strip { width: 25px; height: 60px; flex-shrink: 0; }

        .score-unit { display: flex; height: 60px; align-items: center; flex-grow: 1; position: relative; }
        .team-display { 
            flex-grow: 1; 
            padding: 0 15px; 
            font-size: 36px; 
            font-weight: 900; 
            text-transform: uppercase; 
            overflow: hidden;
            white-space: nowrap;
        }
        .score-box { width: 75px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; flex-shrink: 0; }
        
        /* Card Indicators */
        .card-indicator {
            width: 18px;
            height: 26px;
            border-radius: 3px;
            display: none;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: 1px solid rgba(0,0,0,0.4);
            z-index: 10;
        }
        #cardA { right: 80px; }
        #cardB { left: 80px; }
        .yellow-card { background: #ffd700; display: block; }
        .red-card { background: #ff0000; display: block; }

        .side-a { background: var(--main-red); color: var(--pure-white); border-right: 2px solid white; }
        .side-b { background: var(--pure-white); color: var(--main-red); }

        #match-timer-box { background: var(--main-red); color: white; height: 60px; display: none; align-items: center; padding: 0 15px; font-size: 32px; font-weight: 900; border: 3px solid white; border-left: none; border-radius: 0 6px 6px 0; box-shadow: 5px 5px 15px rgba(0,0,0,0.4); }

        #match-details { display: flex; justify-content: space-between; padding: 0 5px; color: var(--pure-white); font-size: 26px; font-weight: 700; text-shadow: 2px 2px 4px #000; text-transform: uppercase; width: var(--container-width); }

        #penalty-shots-container { display: none; justify-content: space-between; align-items: center; background: var(--main-red); padding: 10px; border: 3px solid white; border-radius: 8px; margin-top: 5px; width: var(--container-width); color: white; }
        .team-shots { display: flex; gap: 3px; }
        .ball { width: 25px; height: 25px; border-radius: 50%; background: #fff; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #000; }
        .ball.goal { background: #00ff00; color: #000; border-color: #fff; }
        .ball.miss { background: #000000; color: #fff; border-color: #fff; }

        #contact-flasher { position: absolute; bottom: 120px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 6px 15px; border-radius: 5px; border-left: 4px solid var(--main-red); font-size: 36px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        #master-footer { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; gap: 4px; padding: 0 10px; }
        .bar { display: flex; height: var(--arrow-height); width: 100%; overflow: hidden; position: relative; border: 2px solid var(--main-red); border-radius: 4px; }
        .top-bg { background: var(--pure-white); }
        .bottom-bg { background: var(--main-red); }
        .box-left, .box-right { width: 50%; height: 100%; position: relative; display: flex; align-items: center; overflow: hidden; }
        .hint-label { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 var(--label-padding); font-weight: 900; font-size: 36px; position: absolute; left: 0; top: 0; z-index: 100; }
        .hint-red { background: var(--main-red); color: var(--pure-white); }
        .hint-white { background: var(--pure-white); color: var(--main-red); }
        marquee { width: 100%; font-size: 36px; font-weight: 900; text-transform: uppercase; padding-left: 130px; }
        .clock-area { position: absolute; right: 0; background: var(--pure-white); color: var(--main-red); min-width: 140px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; z-index: 110; border-left: 2px solid var(--main-red); }

        #watermark { position: fixed; color: #FFFFFF; font-size: 35px; font-weight: 900; z-index: 9999; text-shadow: 2px 2px 0px #000; text-transform: uppercase; pointer-events: none; }
        #goal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 80vh; display: none; justify-content: center; align-items: center; z-index: 500; }
        .goal-text { font-size: 150px; color: #fff; font-weight: 900; text-shadow: 0 0 20px #ff0000; animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { from { transform: scale(0.9); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="goal-overlay"><div class="goal-text">GOAL !!!</div></div>
    <div id="watermark">SUKHDEEP TV</div>

    <div id="contact-flasher">
        <i id="fl-icon" class="fas fa-phone-alt"></i>
        <span id="fl-num">86996-40061</span>
    </div>

    <div id="scoreboard-wrapper">
        <div id="scoreboard-main-row">
            <div id="scoreboard-container">
                <div id="jA" class="jersey-strip"></div>
                <div class="score-unit side-a">
                    <div class="score-box" id="scoreA">0</div>
                    <div class="team-display" id="nameA">TEAM A</div>
                    <div id="cardA" class="card-indicator"></div>
                </div>
                <div class="score-unit side-b">
                    <div id="cardB" class="card-indicator"></div>
                    <div class="team-display" id="nameB" style="text-align: right;">TEAM B</div>
                    <div class="score-box" id="scoreB">0</div>
                </div>
                <div id="jB" class="jersey-strip"></div>
            </div>
            <div id="match-timer-box">00:00</div>
        </div>
        
        <div id="match-details">
            <span id="round-detail">ROUND: 1</span>
            <span id="half-detail">FIRST HALF</span>
        </div>

        <div id="penalty-shots-container">
            <div class="team-shots" id="shotsA"></div>
            <div style="font-weight: 900;">PENALTY</div>
            <div class="team-shots" id="shotsB"></div>
        </div>
    </div>

    <div id="master-footer">
        <div class="bar top-bg">
            <div class="box-left"><div class="hint-label hint-red">LIVE</div><marquee id="tour-name" class="txt-red"></marquee></div>
            <div class="box-right"><div class="hint-label hint-red">TEAMS</div><marquee id="scroll-top" class="txt-red"></marquee></div>
        </div>
        <div class="bar bottom-bg">
            <div class="box-left"><div class="hint-label hint-white">INFO</div><marquee id="sub-info" class="txt-white"></marquee></div>
            <div class="box-right"><div class="hint-label hint-white">PRIZES</div><marquee id="scroll-bot" class="txt-white"></marquee><div class="clock-area" id="live-clock"></div></div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let localSecs = 0;
    let timerInt = null;
    let lastScoreA = 0, lastScoreB = 0;

    db.ref("matchData").on("value", (snap) => {
        const d = snap.val() || {};
        
        if (d.scoreA > lastScoreA || d.scoreB > lastScoreB) { triggerGoal(); }
        lastScoreA = d.scoreA || 0; lastScoreB = d.scoreB || 0;

        document.getElementById('nameA').innerText = (d.nameA || "TEAM A").toUpperCase();
        document.getElementById('nameB').innerText = (d.nameB || "TEAM B").toUpperCase();
        document.getElementById('scoreA').innerText = d.scoreA || "0";
        document.getElementById('scoreB').innerText = d.scoreB || "0";
        document.getElementById('round-detail').innerText = "ROUND: " + (d.matchRound || "1");
        document.getElementById('half-detail').innerText = (d.round || "FIRST HALF").toUpperCase();
        document.getElementById('jA').style.backgroundColor = d.colorA || "#cc0000";
        document.getElementById('jB').style.backgroundColor = d.colorB || "#ffffff";

        updateCards('A', d.cardRecordA);
        updateCards('B', d.cardRecordB);

        if (d.timerRunning && d.startTime) {
            let serverNow = Date.now();
            let calculatedSecs = Math.floor((serverNow - d.startTime) / 1000);
            if (Math.abs(calculatedSecs - localSecs) > 2) { localSecs = calculatedSecs; }
            if (!timerInt) {
                timerInt = setInterval(() => { localSecs++; updateTimerUI(); }, 1000);
            }
        } else {
            clearInterval(timerInt);
            timerInt = null;
            localSecs = d.savedSeconds || 0;
            updateTimerUI();
        }

        renderPenalties('shotsA', d.penaltyA);
        renderPenalties('shotsB', d.penaltyB);
        document.getElementById('penalty-shots-container').style.display = d.penaltyVisible ? 'flex' : 'none';
        document.getElementById('scoreboard-wrapper').style.display = (d.scoreVisible === false) ? 'none' : 'flex';
    });

    function updateTimerUI() {
        let m = Math.floor(localSecs / 60);
        let s = localSecs % 60;
        document.getElementById('match-timer-box').innerText = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        document.getElementById('match-timer-box').style.display = (localSecs > 0 || timerInt) ? "flex" : "none";
    }

    function updateCards(team, record) {
        const cardEl = document.getElementById('card' + team);
        cardEl.className = "card-indicator";
        if (record && record.includes("Yellow")) cardEl.classList.add("yellow-card");
        else if (record && record.includes("Red")) cardEl.classList.add("red-card");
    }

    function renderPenalties(containerId, penaltyString) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        if (!penaltyString) return;
        Array.from(penaltyString).forEach((s, i) => {
            let ball = document.createElement("div");
            ball.className = "ball";
            if (s === "✅") { ball.className = "ball goal"; ball.innerText = "●"; }
            else if (s === "❌") { ball.className = "ball miss"; ball.innerText = "X"; }
            else { ball.innerText = i + 1; }
            container.appendChild(ball);
        });
    }

    db.ref("tickerData").on("value", (snap) => {
        const d = snap.val() || {};
        document.getElementById('tour-name').innerText = (d.tournamentName || "").toUpperCase();
        document.getElementById('scroll-top').innerText = (d.participatingTeams || "").toUpperCase();
        document.getElementById('sub-info').innerText = (d.nextProgram || "LIVE").toUpperCase();
        document.getElementById('scroll-bot').innerText = ("🏆 " + (d.prizes || "")).toUpperCase();
        document.getElementById('watermark').innerText = (d.watermarkText || "SUKHDEEP TV").toUpperCase();
        document.getElementById('fl-num').innerText = d.contact || "86996-40061";
        document.getElementById('master-footer').style.display = (d.tickerVis === false) ? 'none' : 'flex';
    });

    let isW = false;
    setInterval(() => {
        const icon = document.getElementById('fl-icon');
        const numSpan = document.getElementById('fl-num');
        db.ref("tickerData").once("value", (snap) => {
            const d = snap.val() || {};
            if (isW) {
                icon.className = "fab fa-whatsapp"; icon.style.color = "#25D366";
                numSpan.innerText = d.whatsapp || d.contact || "86996-40061";
            } else {
                icon.className = "fas fa-phone-alt"; icon.style.color = "white";
                numSpan.innerText = d.contact || "86996-40061
